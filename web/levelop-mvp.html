<title>Levelop MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">

<script>
/* Oscuro por defecto. Se aplica antes de pintar para que no haya parpadeo. */
try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("lvl-tema") || "dark"); }
catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
</script>

<style>
/* =========================================================
   LEVELOP! — sistema visual "arcade de oficina"
   Negro, lima y blanco. Todo cuadra a una rejilla de 4 px:
   esquinas escalonadas de pixel-art, reglas de bloques,
   medidores de barras. Es un juego, pero uno que lleva
   cuentas de verdad.
   ========================================================= */

/* ---------- TOKENS · claro ---------- */
:root{
  --ground:#EAEAE4; --surface:#FFFFFF; --surface-2:#F1F1EB; --surface-3:#DFDFD7;
  --line:#D0D0C8; --line-strong:#ABABA1;
  --ink:#0B0B0C; --ink-2:#4A4A47; --ink-3:#7A7A75;
  --grid:rgba(11,11,12,.055);

  /* Oro = lima. Es la moneda y es la marca: un solo color fuerte. */
  --gold:#4E6606; --gold-ink:#3C5004; --gold-bg:#E7F7B7; --gold-line:#C4E273; --gold-solid:#C3F03A;
  /* XP = tinta. En el juego, la experiencia no tiene color: tiene peso. */
  --xp:#0B0B0C;   --xp-bg:#E2E2DB;   --xp-line:#BEBEB4;  --xp-solid:#0B0B0C;
  --ok:#0A6B7A;   --ok-bg:#D7EFF4;   --ok-line:#9BD2DE;
  --risk:#C0361F; --risk-bg:#FADFD9; --risk-line:#EEAE9F;
  --sync:#4A38C4; --sync-bg:#E2DEFA; --sync-line:#B4ABF0;

  --shadow:4px 4px 0 rgba(11,11,12,.10);
  --shadow-lg:8px 8px 0 rgba(11,11,12,.18);

  --display:'Silkscreen','Courier New',monospace;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'Space Mono','SFMono-Regular',Consolas,monospace;
}
/* ---------- TOKENS · oscuro (el modo por defecto) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#08080A; --surface:#121215; --surface-2:#1A1A1E; --surface-3:#26262C;
    --line:#2A2A31; --line-strong:#43434E;
    --ink:#EDEDE7; --ink-2:#9B9B95; --ink-3:#6A6A66;
    --grid:rgba(237,237,231,.045);
    --gold:#C3F03A; --gold-ink:#D6F871; --gold-bg:#2A3607; --gold-line:#4A5F0D; --gold-solid:#C3F03A;
    --xp:#EDEDE7;   --xp-bg:#26262C;   --xp-line:#43434E;  --xp-solid:#EDEDE7;
    --ok:#4FD8E8;   --ok-bg:#0A2C33;   --ok-line:#18505C;
    --risk:#FF6A52; --risk-bg:#331310; --risk-line:#57241D;
    --sync:#A79AFF; --sync-bg:#1D1846; --sync-line:#332B70;
    --shadow:4px 4px 0 rgba(0,0,0,.5);
    --shadow-lg:8px 8px 0 rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#08080A; --surface:#121215; --surface-2:#1A1A1E; --surface-3:#26262C;
  --line:#2A2A31; --line-strong:#43434E;
  --ink:#EDEDE7; --ink-2:#9B9B95; --ink-3:#6A6A66;
  --grid:rgba(237,237,231,.045);
  --gold:#C3F03A; --gold-ink:#D6F871; --gold-bg:#2A3607; --gold-line:#4A5F0D; --gold-solid:#C3F03A;
  --xp:#EDEDE7;   --xp-bg:#26262C;   --xp-line:#43434E;  --xp-solid:#EDEDE7;
  --ok:#4FD8E8;   --ok-bg:#0A2C33;   --ok-line:#18505C;
  --risk:#FF6A52; --risk-bg:#331310; --risk-line:#57241D;
  --sync:#A79AFF; --sync-bg:#1D1846; --sync-line:#332B70;
  --shadow:4px 4px 0 rgba(0,0,0,.5);
  --shadow-lg:8px 8px 0 rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:32px 32px;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold-solid); outline-offset:2px}
p{margin:0}
svg{display:block}

h1,h2,h3,h4{margin:0; font-family:var(--display); text-wrap:balance; text-transform:uppercase}
h1{font-weight:700; letter-spacing:.005em; line-height:.94}
h2{font-weight:700; letter-spacing:.01em; line-height:1}
h3,h4{font-weight:700; letter-spacing:0; line-height:1.12}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500; letter-spacing:-.01em}
.score{font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* La forma de la casa: octógono de pixel-art */
.px8{clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}

/* =========================================================
   SHELL
   ========================================================= */
.app{min-height:100vh; display:grid; grid-template-columns:1fr}
.rail{display:none}
.main{min-width:0; display:flex; flex-direction:column}

.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:2px solid var(--line)}
.topbar-in{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.topbar-spacer{flex:1}

.brand{display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:700;
  font-size:24px; text-transform:uppercase; letter-spacing:.01em; line-height:1}
.brand em{font-style:normal; color:var(--gold)}
.brand-mark{width:26px; height:26px; flex:none; display:grid; place-items:center; font-size:15px;
  font-weight:700; font-family:var(--display); color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}

.hudset{display:flex; align-items:center; gap:5px; min-width:0}
.hud{display:inline-flex; align-items:center; gap:6px; padding:5px 9px; background:var(--surface-2);
  border:1px solid var(--line); font-family:var(--mono); font-size:10px; white-space:nowrap; color:var(--ink-2)}
.hud .num{font-size:11.5px; color:var(--ink); font-weight:600}
.hud-l{font-size:8.5px; letter-spacing:-.01em; text-transform:uppercase; opacity:.8}
.hud.is-gold{background:var(--gold-bg); border-color:var(--gold-line); color:var(--gold-ink)}
.hud.is-gold .num{color:var(--gold)}
.hud.is-xp{background:var(--xp-bg); border-color:var(--xp-line); color:var(--ink-2)}
.hud.is-xp .num{color:var(--ink)}
.hud.is-streak{background:var(--risk-bg); border-color:var(--risk-line); color:var(--risk)}
.hud.is-streak .num{color:var(--risk)}
.hud-warn{font-size:8.5px; padding:1px 4px; background:var(--risk); color:#0B0B0C; font-weight:600}
button.hud{cursor:pointer}
button.hud:hover{border-color:var(--line-strong)}
.hud.is-zona svg{width:12px;height:12px;flex:none}
.zona-l{max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
button.chip{cursor:pointer; font:inherit; font-family:var(--mono); font-size:9.5px}
button.chip:hover{border-color:var(--line-strong)}
button.hud:hover{border-color:var(--gold-solid)}

.iconbtn{width:32px; height:32px; display:grid; place-items:center; position:relative; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line)}
.iconbtn:hover{color:var(--ink); border-color:var(--gold-solid)}
.iconbtn .ti{display:block; width:17px; height:17px}
.iconbtn .ti svg{width:100%; height:100%}
.dot{position:absolute; top:4px; right:4px; width:5px; height:5px; background:var(--risk)}

.content{max-width:1180px; margin:0 auto; width:100%; padding:20px 16px 106px; flex:1}

.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--surface);
  border-top:2px solid var(--line); display:flex; padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 1px; color:var(--ink-3);
  font-family:var(--mono); font-size:8px; letter-spacing:-.04em; text-transform:uppercase}
.tab .ti{display:block; width:20px; height:20px}
.tab .ti svg{width:100%; height:100%}
.tab[aria-current="page"]{color:var(--ink)}
.tab-mark{width:16px; height:4px; background:transparent}
.tab[aria-current="page"] .tab-mark{background:var(--gold-solid)}

@media (min-width:960px){
  .app{grid-template-columns:236px 1fr}
  .rail{display:flex; flex-direction:column; gap:3px; padding:18px 12px; background:var(--surface);
    border-right:2px solid var(--line); position:sticky; top:0; height:100vh}
  .rail .brand{padding:4px 8px 20px}
  .railbtn{display:flex; align-items:center; gap:10px; padding:10px 11px; color:var(--ink-2);
    font-family:var(--mono); font-size:10.5px; letter-spacing:0; text-transform:uppercase; text-align:left;
    border:1px solid transparent}
  .railbtn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--line)}
  .railbtn[aria-current="page"]{background:var(--gold-solid); color:#0B0B0C; border-color:var(--gold-solid); font-weight:600}
  .railbtn .ti{display:block; width:18px; height:18px}
  .railbtn .ti svg{width:100%; height:100%}
  .tabbar{display:none}
  .content{padding-bottom:52px}
  .topbar .brand{display:none}
}

/* =========================================================
   PRIMITIVAS
   ========================================================= */
.card{background:var(--surface); border:1px solid var(--line)}
.stack{display:flex; flex-direction:column}
.g6{gap:6px} .g8{gap:8px} .g9{gap:9px} .g10{gap:10px} .g12{gap:12px} .g14{gap:14px} .g16{gap:16px}
.row{display:flex; align-items:center}
.wrap{flex-wrap:wrap}

.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:9px;
  letter-spacing:.01em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::after{content:""; width:22px; height:4px;
  background-image:linear-gradient(90deg,var(--line-strong) 0 4px,transparent 4px 8px); background-size:8px 4px}

.page-h{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px}
.page-h h1{font-size:40px; margin-top:4px}
.sub{color:var(--ink-2); font-size:13px}
.sec-h{display:flex; align-items:center; gap:12px; margin:28px 0 12px}
.sec-h h2{font-size:19px; flex:none}
.sec-h .sub{order:3; text-align:right; flex:none; max-width:46%}
.sec-h::before{content:""; order:2; flex:1; height:4px; min-width:18px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px); background-size:8px 4px}
@media (max-width:700px){
  .sec-h{flex-wrap:wrap}
  .sec-h .sub{flex:1 0 100%; max-width:100%; text-align:left; order:3}
}

.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 7px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:0; white-space:nowrap; background:var(--surface-2); border:1px solid var(--line);
  color:var(--ink-2); text-transform:uppercase}
.chip svg{width:11px; height:11px; flex:none}
.chip.gold{background:var(--gold-bg); border-color:var(--gold-line); color:var(--gold-ink)}
.chip.xp  {background:var(--xp-bg);   border-color:var(--xp-line);   color:var(--ink)}
.chip.ok  {background:var(--ok-bg);   border-color:var(--ok-line);   color:var(--ok)}
.chip.risk{background:var(--risk-bg); border-color:var(--risk-line); color:var(--risk)}
.chip.sync{background:var(--sync-bg); border-color:var(--sync-line); color:var(--sync)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px;
  font-family:var(--mono); font-size:10px; letter-spacing:0; text-transform:uppercase; font-weight:500;
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  transition:background .1s steps(2), transform .06s steps(1)}
.btn svg{width:14px; height:14px}
.btn:hover{background:var(--surface-3); border-color:var(--gold-solid)}
.btn:active{transform:translate(1px,1px)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2); border-color:var(--ink-2)}
.btn.gold{background:var(--gold-solid); color:#0B0B0C; border-color:var(--gold-solid); font-weight:600}
.btn.gold:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.sm{padding:6px 9px; font-size:9px}
.btn.sm svg{width:12px; height:12px}
.btn.wide{width:100%}

.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); padding:2px; gap:2px}
.seg button{padding:6px 11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold-solid); color:#0B0B0C; font-weight:600}

.scroller{display:flex; gap:6px; overflow-x:auto; padding:0 16px 5px; margin:0 -16px; scrollbar-width:thin}
.fchip{padding:7px 11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0; text-transform:uppercase;
  color:var(--ink-2); background:var(--surface); border:1px solid var(--line); white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--gold-solid); border-color:var(--gold-solid); color:#0B0B0C; font-weight:600}

.av{width:30px; height:30px; flex:none; display:grid; place-items:center; font-family:var(--mono); font-size:9px;
  font-weight:600; color:#fff; letter-spacing:-.02em;
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.av.lg{width:72px; height:72px; font-size:22px; font-family:var(--display); font-weight:700; letter-spacing:.02em}
.av.sm{width:24px; height:24px; font-size:7.5px}
.avstack{display:flex}
.avstack .av{margin-left:-5px}
.avstack .av:first-child{margin-left:0}

.seal{width:60px; height:60px; flex:none; display:grid; place-items:center; color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.seal b{font-family:var(--display); font-weight:400; font-size:27px; line-height:1}
.seal i{font-style:normal; font-family:var(--mono); font-size:6.5px; letter-spacing:-.04em; text-transform:uppercase; opacity:.72}
.seal.sm{width:34px; height:34px}
.seal.sm b{font-size:15px}
.seal.sm i{display:none}

.meter{display:flex; gap:2px; align-items:stretch; height:12px}
.meter i{flex:1; background:var(--surface-3); transition:background .2s steps(2)}
.meter i.on{background:var(--xp-solid)}
.meter.gold i.on{background:var(--gold-solid)}
.meter.sm{height:8px}

.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:13px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.kv:last-child{background-image:none}
.kv span:first-child{color:var(--ink-2)}

.note{padding:11px 12px; font-size:12.5px; line-height:1.55; background:var(--surface-2);
  border:1px solid var(--line); border-left-width:4px; color:var(--ink-2)}
.note.sync{background:var(--sync-bg); border-color:var(--sync-line); border-left-color:var(--sync); color:var(--sync)}
.note.risk{background:var(--risk-bg); border-color:var(--risk-line); border-left-color:var(--risk); color:var(--risk)}
.note.gold{background:var(--gold-bg); border-color:var(--gold-line); border-left-color:var(--gold-solid); color:var(--gold-ink)}
.note.ok{background:var(--ok-bg); border-color:var(--ok-line); border-left-color:var(--ok); color:var(--ok)}
.note b{font-weight:700}
.empty{padding:28px 18px; text-align:center; color:var(--ink-3); font-size:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.01em}

/* =========================================================
   INICIO · bento
   ========================================================= */
.bento{display:grid; gap:10px; grid-template-columns:1fr}
@media (min-width:700px){.bento{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.bento{grid-template-columns:repeat(3,1fr)}}
.bento>*{min-width:0}
.w{display:flex; flex-direction:column; min-width:0; padding:14px 15px; background:var(--surface); border:1px solid var(--line)}
.w-h{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.w-h .wi{width:16px; height:16px; color:var(--gold); flex:none}
.w-h h3{font-size:15px; flex:1; min-width:0; overflow-wrap:anywhere}
.w-h .c{font-family:var(--mono); font-size:9px; color:var(--ink-3); flex:none}
.w-body{display:flex; flex-direction:column; gap:9px; flex:1; min-width:0}
@media (min-width:700px){ .w.x2{grid-column:span 2} }
@media (min-width:1080px){ .w.x3{grid-column:span 3} }
.mini{display:flex; gap:10px; align-items:flex-start; padding-bottom:9px; text-align:left; width:100%; min-width:0;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.mini:last-child{background-image:none; padding-bottom:0}
.mini-b{flex:1; min-width:0}
.mini-t{font-size:13.5px; font-weight:600; line-height:1.35; overflow-wrap:anywhere}
.mini-m{display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap; min-width:0}
.mini-x{font-family:var(--mono); font-size:8.5px; color:var(--ink-3); letter-spacing:0;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase}

.saludo{padding:18px; background:var(--surface); border:2px solid var(--ink); box-shadow:var(--shadow); margin-bottom:16px}
.saludo h1{font-size:32px}
@media (min-width:700px){.saludo h1{font-size:44px}}
.pixels{display:flex; gap:3px; margin-bottom:12px}
.pixels i{width:8px; height:8px; background:var(--gold-solid); display:block}
.pixels i:nth-child(4){background:var(--line-strong)}
.pixels i:nth-child(5){background:var(--line-strong); opacity:.5}

.news{display:flex; gap:11px; align-items:flex-start; padding:11px 0;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.news:last-child{background-image:none}
.news-i{width:32px; height:32px; flex:none; display:grid; place-items:center; color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.news-i svg{width:15px; height:15px}
.news-i.lvl{color:var(--ink); background:var(--surface-3)}
.news-t{font-size:13.5px; font-weight:600; line-height:1.35}
.news-d{font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.5}

/* =========================================================
   MISIONES
   ========================================================= */
.mission{display:block; width:100%; text-align:left; padding:14px 15px; background:var(--surface);
  border:1px solid var(--line); transition:border-color .1s steps(2), transform .06s steps(1)}
.mission:hover{border-color:var(--gold-solid); transform:translate(-1px,-1px); box-shadow:var(--shadow)}
.mission-top{display:flex; gap:11px; align-items:flex-start; margin-bottom:10px}
.mission h3{font-size:17px; flex:1; line-height:1.15}
.mission-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:11px}
.mission-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:10px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:top}
.rewards{display:flex; gap:6px; align-items:center}
.area-tag{font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:0; color:var(--ink-3)}
.thread-count{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--ink-3)}
.thread-count svg{width:13px; height:13px}

.stat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--line); border:1px solid var(--line)}
.stat{background:var(--surface); padding:12px 13px}
.stat .l{font-family:var(--mono); font-size:8px; text-transform:uppercase; letter-spacing:.01em; color:var(--ink-3)}
.stat .v{font-family:var(--display); font-weight:700; font-size:32px; line-height:.95; margin-top:4px; font-variant-numeric:tabular-nums}

/* =========================================================
   HOJA / MODAL
   ========================================================= */
.veil{position:fixed; inset:0; z-index:60; background:rgba(4,4,6,.72); display:flex; align-items:flex-end; justify-content:center}
@media (min-width:760px){.veil{align-items:center; padding:24px}}
.sheet{width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; background:var(--surface);
  border:2px solid var(--ink); box-shadow:var(--shadow-lg); animation:rise .18s steps(3)}
@keyframes rise{from{transform:translateY(16px)} to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{padding:16px 18px 14px; display:flex; gap:12px; align-items:flex-start;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.sheet-h h2{font-size:21px; flex:1; line-height:1.05}
.sheet-b{padding:16px 18px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px}
.sheet-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:8px;
  background:var(--surface); border-top:2px solid var(--line)}
.closebtn{width:30px; height:30px; flex:none; display:grid; place-items:center; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line)}
.closebtn:hover{border-color:var(--risk); color:var(--risk)}
.closebtn svg{width:13px; height:13px}

.msg{display:flex; gap:10px}
.msg-b{flex:1; min-width:0}
.msg-n{font-size:12.5px; font-weight:700}
.msg-n small{font-weight:400; color:var(--ink-3); font-family:var(--mono); font-size:8px; margin-left:7px; text-transform:uppercase}
.msg-t{font-size:13.5px; color:var(--ink-2); margin-top:3px; line-height:1.55; overflow-wrap:anywhere}
.msg-t .mention{color:var(--gold); font-weight:700}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{flex:1; resize:none; padding:10px 12px; border:1px solid var(--line); background:var(--surface-2);
  font-size:13.5px; line-height:1.45; min-height:42px; max-height:120px; font-family:var(--body)}
.composer textarea:focus{outline:none; border-color:var(--gold-solid); background:var(--surface)}

/* =========================================================
   TIENDA
   ========================================================= */
.shop-grid{display:grid; gap:10px; grid-template-columns:1fr}
@media (min-width:640px){.shop-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.shop-grid{grid-template-columns:1fr 1fr 1fr}}
.item{display:flex; flex-direction:column; gap:10px; padding:14px 15px; background:var(--surface); border:1px solid var(--line)}
.item:hover{border-color:var(--line-strong)}
.item.locked{opacity:.6}
.item.agotado{opacity:.5}
.item.objetivo{border-color:var(--gold-solid); border-width:2px}
.item-h{display:flex; gap:11px; align-items:flex-start}
.item-ico{width:38px; height:38px; flex:none; display:grid; place-items:center; color:var(--ink); background:var(--surface-3);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.item-ico svg{width:18px; height:18px}
.item h3{font-size:16px; flex:1; line-height:1.14}
.item p{font-size:12.5px; color:var(--ink-2); line-height:1.55}
.item-f{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:11px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:top}
.price{display:inline-flex; align-items:baseline; gap:4px; color:var(--gold)}
.price b{font-family:var(--display); font-weight:700; font-size:24px; line-height:.9; font-variant-numeric:tabular-nums}
.price small{font-family:var(--mono); font-size:8px; letter-spacing:.01em; text-transform:uppercase}
.cupo{display:flex; align-items:center; gap:8px}
.cupo .meter{width:56px; flex:none}
.power{display:flex; align-items:center; gap:2px; margin-top:5px}
.power i{width:9px; height:5px; background:var(--surface-3); display:block}
.power i.on{background:var(--gold-solid)}
.power .mini-x{margin-left:5px}
.btn.sug{width:100%; margin-top:11px; justify-content:center; color:var(--ink-2);
  border:1px dashed var(--line-strong); background:transparent}
.btn.sug svg{width:14px; height:14px}
.btn.sug:hover{background:var(--surface-2); color:var(--ink); border-style:solid; border-color:var(--gold-solid)}
.obj-card{border-left:4px solid var(--gold-solid)}

/* =========================================================
   RANKING
   ========================================================= */
.rank-row{display:flex; align-items:center; gap:11px; padding:10px 13px; background:var(--surface); border:1px solid var(--line)}
.rank-row.me{background:var(--gold-bg); border-color:var(--gold-solid); border-width:2px}
.rank-pos{font-family:var(--display); font-weight:700; font-size:20px; color:var(--ink-3); width:28px;
  text-align:right; flex:none; line-height:1; font-variant-numeric:tabular-nums}
.rank-row.me .rank-pos{color:var(--gold)}
.rank-b{flex:1; min-width:0}
.rank-n{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank-s{font-family:var(--mono); font-size:8.5px; color:var(--ink-3); letter-spacing:0; text-transform:uppercase}
.rank-v{font-family:var(--mono); font-size:11px; text-align:right; flex:none; font-variant-numeric:tabular-nums; font-weight:500}
.gap-mark{display:flex; align-items:center; gap:10px; padding:4px 0 4px 40px; color:var(--ink-3);
  font-family:var(--mono); font-size:8.5px; letter-spacing:0; text-transform:uppercase}
.altboard{padding:14px 15px; background:var(--surface); border:1px solid var(--line)}
.altboard h3{font-size:16px; margin-bottom:3px}
.altboard .why{font-size:12px; color:var(--ink-3); margin-bottom:11px; line-height:1.5}

/* =========================================================
   PERFIL
   ========================================================= */
.hero{padding:18px; background:var(--surface); border:2px solid var(--ink); box-shadow:var(--shadow)}
.hero-top{display:flex; gap:14px; align-items:center}
.av-wrap{position:relative; flex:none}
.av-wrap .seal{position:absolute; right:-10px; bottom:-8px}
.hero-n{font-family:var(--display); font-size:26px; font-weight:700; line-height:1; text-transform:uppercase}
.pos-card{padding:14px 15px; background:var(--surface-2); border:1px solid var(--line)}

.trophy-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px}
.trophy{display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 8px 11px; text-align:center;
  background:var(--surface); border:1px solid var(--line); transition:transform .06s steps(1), border-color .1s steps(2)}
.trophy:hover{transform:translate(-1px,-1px); border-color:var(--gold-solid); box-shadow:var(--shadow)}
.trophy .tico{width:46px; height:46px; display:grid; place-items:center; color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.trophy .tico svg{width:22px; height:22px}
.trophy.locked .tico{background:var(--surface-3); color:var(--ink-3)}
.trophy.equipo .tico{color:#0B0B0C; background:var(--ok)}
.trophy.equipo.locked .tico{background:var(--surface-3); color:var(--ink-3)}
.trophy.oculto .tico{background:var(--sync); color:#fff}
.trophy.oculto-card{opacity:.55; cursor:default}
.trophy.oculto-card .tico{background:var(--surface-3); color:var(--ink-3)}
.trophy .tn{font-family:var(--display); font-size:14px; font-weight:400; line-height:1.1; text-transform:uppercase}
.trophy .td{font-family:var(--mono); font-size:7.5px; color:var(--ink-3); letter-spacing:0; text-transform:uppercase}
.trophy .meter{width:100%}

.benefit{display:flex; gap:11px; align-items:flex-start; padding:13px 14px; background:var(--surface); border:1px solid var(--line)}
.benefit.ind{background:var(--sync-bg); border-color:var(--sync-line)}
.benefit h4{font-family:var(--display); font-size:15px; font-weight:700; text-transform:uppercase; line-height:1.1}

.switch{width:44px; height:24px; background:var(--line-strong); position:relative; flex:none; transition:background .1s steps(2)}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; background:var(--surface);
  transition:transform .12s steps(3)}
.switch[aria-checked="true"]{background:var(--gold-solid)}
.switch[aria-checked="true"]::after{transform:translateX(20px); background:#0B0B0C}
.setting{display:flex; gap:13px; align-items:center; padding:14px 15px}
.setting-b{flex:1}
.setting-b .t{font-family:var(--display); font-size:16px; font-weight:700; text-transform:uppercase; line-height:1.1}
.setting-b .d{font-size:12.5px; color:var(--ink-2); margin-top:3px}

.pleg{margin-bottom:10px}
.pleg-h{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 13px;
  background:var(--surface); border:1px solid var(--line)}
.pleg-h:hover{background:var(--surface-2); border-color:var(--line-strong)}
.pleg-h h2{font-size:17px; flex:none}
.pleg-h .sub{flex:1; text-align:right}
.pleg-i{width:16px; height:16px; flex:none; color:var(--ink-3); transition:transform .12s steps(3)}
.pleg-i.open{transform:rotate(180deg)}
.pleg-b{padding:12px 0 4px}

/* =========================================================
   AVISOS · desplegable
   ========================================================= */
.bellwrap{position:relative}
.drop{position:absolute; top:calc(100% + 7px); right:0; width:min(94vw, 380px); z-index:60;
  background:var(--surface); border:2px solid var(--ink); box-shadow:var(--shadow-lg); animation:rise .12s steps(2)}
.drop[hidden]{display:none}
.drop-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px 10px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.drop-b{max-height:min(64vh,460px); overflow-y:auto}
.aviso{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-left:4px solid var(--line-strong)}
.aviso + .aviso{border-top:1px solid var(--line)}
.aviso-i{width:28px; height:28px; flex:none; display:grid; place-items:center; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line)}
.aviso-i svg{width:14px; height:14px}
.aviso-t{font-size:13px; font-weight:600; line-height:1.35}
.aviso.sync{border-left-color:var(--sync)} .aviso.sync .aviso-i{color:var(--sync); background:var(--sync-bg); border-color:var(--sync-line)}
.aviso.gold{border-left-color:var(--gold-solid)} .aviso.gold .aviso-i{color:var(--gold); background:var(--gold-bg); border-color:var(--gold-line)}
.aviso.risk{border-left-color:var(--risk)} .aviso.risk .aviso-i{color:var(--risk); background:var(--risk-bg); border-color:var(--risk-line)}
.aviso.ok{border-left-color:var(--ok)}     .aviso.ok .aviso-i{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line)}
.aviso.xp{border-left-color:var(--ink)}    .aviso.xp .aviso-i{color:var(--ink); background:var(--xp-bg); border-color:var(--xp-line)}

/* =========================================================
   BLOQUES v0.4
   ========================================================= */
.meta-card{padding:15px 16px; display:flex; flex-direction:column}
.meta-card h3{font-size:15px}
.meta-card .wi{width:16px; height:16px; color:var(--gold); flex:none}
.duelo-w{grid-column:1 / -1; padding:0; background:none; border:0}
.duelo{border:2px solid var(--ink); background:var(--surface); box-shadow:var(--shadow)}
.duelo-h{display:flex; align-items:center; gap:9px; padding:11px 13px; box-shadow:inset 0 -1px 0 var(--line)}
.duelo-h .wi{color:var(--gold)}
.duelo-h .wi svg{width:15px; height:15px; display:block}

.duelo-s .av{width:auto; height:auto; background:none; clip-path:none; display:block;

.duelo-f{padding:11px 13px; box-shadow:inset 0 1px 0 var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.duelo-sum{display:flex; gap:7px; flex-wrap:wrap; padding:0 13px 12px}
.privado{border:2px dashed var(--gold-line); background:var(--gold-bg); padding:13px}
.meta-w{padding:0; background:none; border:0}
.meta-w .meta-card{height:100%; border:1px solid var(--line); background:var(--surface)}
.proy-dot{width:8px; height:8px; flex:none; display:inline-block; vertical-align:middle}

.bar-track{display:block; height:12px; background:var(--surface-2); flex:1; min-width:0; border:1px solid var(--line)}
.bar-fill{display:block; height:100%; transition:width .3s steps(8)}
.c-n{background:var(--line-strong)} .c-xp{background:var(--xp-solid)} .c-gold{background:var(--gold-solid)}
.c-risk{background:var(--risk)} .c-ok{background:var(--ok)}

.estado-row{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:3px 0}

.rep-row{display:flex; align-items:center; gap:10px; padding:9px 11px; background:var(--surface-2); border:1px solid var(--line)}

.rep-n{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.msg.sistema{padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--ok)}
.msg-sis{width:24px; height:24px; flex:none; display:grid; place-items:center; color:#0B0B0C; background:var(--ok)}

.regla{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); line-height:1.55}

   AVISOS FLOTANTES
   ========================================================= */
.toasts{position:fixed; left:12px; right:12px; bottom:80px; z-index:70; display:flex; flex-direction:column;

.toast .tt{font-family:var(--display); font-size:15px; font-weight:700; text-transform:uppercase; line-height:1.15}
.toast .td{font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.5}
.toast.sync{border-color:var(--sync)} .toast.sync .td, .toast.sync .ti{color:var(--sync)}
.toast.ok{border-color:var(--ok)}     .toast.ok .td, .toast.ok .ti{color:var(--ok)}
.toast.risk{border-color:var(--risk)} .toast.risk .td, .toast.risk .ti{color:var(--risk)}

.optout-banner{padding:12px 13px; background:var(--surface-2); border:1px dashed var(--line-strong);

/* =========================================================
   FORMULARIOS
   ========================================================= */
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:.01em; color:var(--ink-3)}
.field input, .field select, .field textarea{padding:10px 12px; border:1px solid var(--line); background:var(--surface-2);

.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold-solid); background:var(--surface)}
.field select{appearance:none; background-image:none}
.pickav{display:flex; gap:6px; flex-wrap:wrap}
.pickav button{width:32px; height:32px;

/* Iconos en línea dentro de texto: nunca a tamaño de bloque */

  .page-h h1{font-size:30px}
  .sheet-h h2{font-size:18px}
  .hero-n{font-size:21px}
  .drop{position:fixed; top:54px; left:8px; right:8px; width:auto}
  .bl{width:74px}
  .tab{font-size:7px}
}

/* =========================================================
   CIFRAS SIEMPRE EN REGULAR 400
   Silkscreen y Space Mono en 700 engordan el dígito y le
   quitan el contraforma. Los números se leen mejor en 400,
   así que ningún número del sistema va en negrita — ni los
   grandes ni los de una tabla. La jerarquía la hace el
   tamaño, no el peso.
   ========================================================= */

/* SIGNO % EN QUANTICO — Silkscreen pierde la forma del '%',
   así que en cualquier valor con Silkscreen se aísla el signo
   en .pct para que se lea con Quantico en su lugar. */
.pct{font-family:'Quantico','Courier New',monospace; font-weight:400}
.num, .hud .num, .score, .seal b, .stat .v, .stat b, .tile .v, .price b,
.rank-pos, .rank-v, .bv, .bar-row .bv, .w-h .c, .paso-n, .chip.num,
td.n, #tip .tr b, #tip .tr span, .pat-sig .sv, .plist .pr b, .fstep .fn,
.duelo-s .av, .duel-side .av2, .cal .dn, .cal-more, .mini-bar + span,
.ranklist b, .lote .bv, .meter-v, .gauge-v{
  font-weight:400 !important;
}

/* =========================================================
   AÑADIDO EN LA CONEXIÓN AL BACKEND (14/09/26)
   -----------------------------------------------------------
   Decisión de Alim: lo que el backend todavía no soporta
   queda VISIBLE y MARCADO, nunca oculto sin explicación ni
   simulado en silencio. Estas clases son ese marcado.
   ========================================================= */
.nc{position:relative; border-style:dashed; border-color:var(--line-strong)}
.nc .w-h h3, .nc h2, .nc h3{color:var(--ink-3)}
.nc .w-h .wi{color:var(--ink-3)}

const H = 3600e3;

/* =========================================================
   COPY DE LOS RECHAZOS TIPIFICADOS
   -------------------------------------------------------
   El backend no devuelve un 409 genérico: devuelve un
   `motivoRechazo` de una lista cerrada. Eso existe porque
   el PD lo exigió (canal CTO ↔ PD, MSG-002): con un solo
   código de error hay que escribir copy vago, y en un
   sistema donde el Oro vale algo, un mensaje vago se lee
   como «me robaron».

   Esta tabla es la otra mitad de ese acuerdo. Si el
   backend agrega un motivo nuevo y no está aquí, se ve el
   código crudo — feo a propósito, para que se note y se
   escriba el copy en vez de quedarse en un genérico.
   ========================================================= */
const COPY_RECHAZO = {
  DUPLICADO:          ["Esto ya estaba contado", "Ya habíamos registrado este mismo movimiento. No perdiste nada."],
  CAP_DIARIO:         ["Llegaste al tope de hoy", "Hay un tope de Oro por día. Lo que cierres de más sigue contando para tu trabajo, y mañana el tope vuelve a cero."],
  DERIVA_RELOJ:       ["La hora de tu equipo no cuadra", "El reloj de tu dispositivo está muy lejos del servidor. Ajústalo y vuelve a intentar."],
  TENANT_INVALIDO:    ["No pudimos ubicar tu empresa", "Cierra sesión y vuelve a entrar. Si sigue pasando, avísale a tu líder."],
  SALDO_INSUFICIENTE: ["No te alcanza el Oro", "Te falta Oro para este beneficio. No se te descontó nada."],
  CUPO_AGOTADO:       ["Alguien se llevó el último cupo", "Se acabaron los cupos. No se te descontó nada — el Oro sigue completo."],
  ZONA_NO_APLICA:     ["Este no aplica en tu ciudad", "Solo está disponible en otras zonas. Tu zona la fija RRHH de tu empresa, no se cambia desde aquí."],
  ITEM_INACTIVO:      ["Ese beneficio ya no está", "Lo sacaron del catálogo. No se te descontó nada."],
  OPT_OUT_ACTIVO:     ["Tienes el juego apagado", "Con el juego apagado no se piden beneficios. Lo prendes desde tu Perfil."]
};

/* =========================================================
   ESTADO
   ========================================================= */
const D = {            // datos REALES, todos del servidor
  membresia: null,     // identidad + tenant + área + zona + opt-in
  misiones: [],
  saldo: 0,
  catalogo: [],
  canjes: [],
  /* 16/09/26 — cableado de lo que el backend ya tenía desde el 14/09 y la
     app nunca había pedido: ranking, avisos, compañeros, progreso. */
  ranking: null,       // { participo, miPosicion, tabla[] }
  avisos: [],          // notificaciones propias, más nuevas primero
  miembros: [],        // compañeros: { membershipId, nombre, rol, areaId, areaNombre }
  progreso: null,      // { xp, oro, nivel, xpInicioNivel, xpSiguienteNivel }
  cargado: false
};
const state = {
  tab: "inicio",
  filtro: "todas",
  periodo: "semana",
  shopFamilia: "todas",
  plegado: {beneficios:false},
  abierta: null,
  cargando: false,
  errorCarga: null
};
const PERIODOS = {dia:{n:"Hoy", h:24}, semana:{n:"Semana", h:24*7}, mes:{n:"Mes", h:24*30}};

/* Atajos de identidad, todos leídos del servidor. */
const mid       = () => D.membresia && D.membresia.membershipId;
const miNombre  = () => (D.membresia && D.membresia.usuarioNombre) || "";
const miZona    = () => (D.membresia && D.membresia.zona) || "—";
const miArea    = () => (D.membresia && D.membresia.areaNombre) || null;
const optIn     = () => !!(D.membresia && D.membresia.optInJuego);
const iniciales = n => String(n||"").trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase() || "?";
/* Un membershipId → un nombre, con la lista de compañeros del servidor.
   Si la lista no cargó (o la persona ya no está activa), se ve el id corto
   — nunca un nombre inventado. */
const nombreDe  = id => { if(!id) return "—"; if(id===mid()) return "Tú"; const p = D.miembros.find(x=>x.membershipId===id); return p ? p.nombre : String(id).slice(0,8); };
const noLeidos  = () => D.avisos.filter(a=>!a.leida).length;

/* =========================================================
   UTILIDADES
   ========================================================= */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n||0).toLocaleString("es-VE");
const MESES   = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fecha      = d => `${String(d.getDate()).padStart(2,"0")} ${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
const fechaLarga = d => `${d.getDate()} de ${MESES_L[d.getMonth()]}`;
/* 17/09 (Alim): las fechas de entrega se ven "21-09", no "21 de septiembre". */
const fechaCorta = d => `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`;

/* Hoy y mañana en palabras; de ahí en adelante, la fecha real (pedido de Alim) */
function restante(ms){
  if(ms == null) return {txt:"Sin fecha", tipo:""};
  if(ms < 0){
    const h = Math.round(-ms/H);
    return {txt: h<24 ? `Se venció hace ${h} h` : `Se venció hace ${Math.round(h/24)} d`, tipo:"risk"};
  }
  const h = ms/H;
  if(h < 1)  return {txt:`Quedan ${Math.max(1,Math.round(h*60))} min`, tipo:"risk"};
  if(h < 12) return {txt:`Quedan ${Math.round(h)} h`, tipo:"risk"};
  if(h < 24) return {txt:"Se vence hoy", tipo:"gold"};
  if(h < 48) return {txt:"Se vence mañana", tipo:"gold"};
  return {txt:`Entrega ${fechaCorta(new Date(Date.now()+ms))}`, tipo:""};
}

function toast(tipo, ico, t, d, ms=4400){
  const el=document.createElement("div");
  el.className="toast "+tipo;
  el.innerHTML=`<span class="ti">${IC[ico]||IC.check}</span><div><div class="tt">${esc(t)}</div><div class="td">${esc(d)}</div></div>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),320); }, ms);
}

/** Traduce cualquier error del backend a algo que una persona pueda leer. */
function avisarError(e, dondeFallo){
  if(e && e.motivoRechazo){
    const c = COPY_RECHAZO[e.motivoRechazo];
    if(c) return toast("risk","alerta", c[0], c[1], 6000);
    return toast("risk","alerta","No se pudo", `El servidor respondió «${e.motivoRechazo}». Ese motivo todavía no tiene mensaje escrito.`, 6000);
  }
  if(e && e.status === 401) return toast("risk","candado","Se cerró tu sesión","Vuelve a entrar con tu correo y contraseña.", 6000);
  if(e && e.status === 403) return toast("risk","candado","No tienes permiso","Tu cuenta no tiene acceso a esta acción en esta empresa.", 6000);
  console.error(dondeFallo, e);
  toast("risk","alerta","No se pudo conectar", (e && e.message) ? String(e.message) : "Revisa que el backend esté corriendo.", 7000);
}

/* =========================================================
   MISIONES — mapeo del modelo real
   -------------------------------------------------------
   Los estados son los del backend (`EstadoMision`), no una
   traducción libre: si el servidor dice `entregada`, aquí
   dice «Entregada». Inventar un vocabulario paralelo es la
   forma más fácil de que la pantalla y la base dejen de
   significar lo mismo.
   ========================================================= */
const ESTADOS = {
  borrador:    {n:"Borrador",   c:""},
  abierta:     {n:"Abierta",    c:""},
  aceptada:    {n:"Aceptada",   c:"xp"},
  en_progreso: {n:"En curso",   c:"xp"},
  entregada:   {n:"Entregada",  c:"gold"},
  cerrada:     {n:"Cerrada",    c:"ok"},
  cancelada:   {n:"Cancelada",  c:""}
};
const NIVEL_TXT = {baja:"Baja", media:"Media", alta:"Alta", bajo:"Bajo", medio:"Medio", alto:"Alto"};

const viva      = m => m.estado !== "cerrada" && m.estado !== "cancelada";
const venceEn   = m => m.fechaLimite ? (new Date(m.fechaLimite).getTime() - Date.now()) : null;
const enRiesgo  = m => viva(m) && venceEn(m) !== null && venceEn(m) < 0;
const esMia     = m => !!mid() && (m.creadorMembershipId===mid() || m.asignadoMembershipId===mid() || m.aceptadaPorMembershipId===mid());
const puedeAceptar = m => !!mid() && m.estado==="abierta" && m.creadorMembershipId!==mid() && !m.aceptadaPorMembershipId;

/**
 * Una misión creada por uno mismo NO da Oro hasta que otra
 * persona la acepte (Maestro §3.3). Es el anti-cheat más
 * barato que existe y la app tiene que decirlo ANTES, no
 * después de cerrar y ver cero.
 */
const daraOro = m => !!m.aceptadaPorMembershipId && m.aceptadaPorMembershipId !== m.creadorMembershipId;

async function cargarTodo(){
  state.cargando = true; state.errorCarga = null; render();
  try{
    const [misiones, saldo, catalogo, canjes] = await Promise.all([
      LevelopAPI.misiones.listar(),
      LevelopAPI.economia.saldo(),
      LevelopAPI.tienda.catalogo(),
      LevelopAPI.tienda.misCanjes()
    ]);
    D.misiones = Array.isArray(misiones) ? misiones : [];
    D.saldo    = (saldo && typeof saldo.oro === "number") ? saldo.oro : 0;
    D.catalogo = Array.isArray(catalogo) ? catalogo : [];
    D.canjes   = Array.isArray(canjes) ? canjes : [];
    D.cargado  = true;
  }catch(e){
    state.errorCarga = e;
    avisarError(e, "cargarTodo");
  }finally{
    state.cargando = false; render();
  }
  /* Lo secundario se carga aparte y con tolerancia: si el ranking o los
     avisos fallan, la app sigue usable con misiones y Oro. Cada bloque se
     marca como "no disponible" en su propia pantalla, no se inventa. */
  await cargarSecundario();
  render();
}
async function cargarSecundario(){
  const r = await Promise.allSettled([
    LevelopAPI.equipo.miembros(),
    LevelopAPI.economia.miProgreso(),
    LevelopAPI.economia.ranking(),
    LevelopAPI.avisos.listar()
  ]);
  if(r[0].status==="fulfilled" && Array.isArray(r[0].value)) D.miembros = r[0].value;
  if(r[1].status==="fulfilled" && r[1].value) D.progreso = r[1].value;
  if(r[2].status==="fulfilled" && r[2].value) D.ranking  = r[2].value;
  if(r[3].status==="fulfilled" && Array.isArray(r[3].value)) D.avisos = r[3].value;
  anunciarBeneficiosNuevos();
  r.forEach((x,i)=>{ if(x.status==="rejected") console.warn("secundario", ["miembros","progreso","ranking","avisos"][i], x.reason); });
  pintarBellDot();
}
async function refrescarSaldo(){
  try{ const s = await LevelopAPI.economia.saldo(); D.saldo = s.oro; }catch(e){ /* el saldo viejo sigue siendo mejor que un cero falso */ }
  try{ D.progreso = await LevelopAPI.economia.miProgreso(); }catch(e){ /* idem: el progreso viejo antes que un guion */ }
}

   en Avisos, así como un pop up anunciándolo". El pop-up sale UNA vez por

  const nuevos = D.avisos.filter(a=>a.tipo==="BENEFICIO_NUEVO" && !a.leida);

async function marcarLeidos(ids){
  for(const id of ids){ const a = D.avisos.find(x=>x.id===id); if(a && !a.leida){ a.leida = true; try{ await LevelopAPI.avisos.marcarLeida(id); }catch(e){} } }

async function refrescarAvisos(){
  try{
    const l = await LevelopAPI.avisos.listar();

    pintarBellDot();

const deMiArea = m => !!(D.membresia && D.membresia.areaId) && m.areaId === D.membresia.areaId;
function misionesFiltradas(){
  let lista;
  if(state.filtro==="todas")       lista = D.misiones.filter(viva);
  else if(state.filtro==="mias")   lista = D.misiones.filter(esMia);
  else if(state.filtro==="area")   lista = D.misiones.filter(m=>viva(m) && deMiArea(m));
  else if(state.filtro==="riesgo") lista = D.misiones.filter(enRiesgo);
  else                             lista = D.misiones.filter(m=>m.estado===state.filtro);
  return lista.sort((a,b)=>{
    const va = venceEn(a), vb = venceEn(b);
    if(va===null && vb===null) return 0;
    if(va===null) return 1;
    if(vb===null) return -1;
    return va-vb;
  });
}

  const span = Math.max(1, p.xpSiguienteNivel - p.xpInicioNivel);
  const pct  = Math.max(0, Math.min(100, ((p.xp - p.xpInicioNivel) / span) * 100));
  const falta = Math.max(0, p.xpSiguienteNivel - p.xp);
  return `<section class="w" style="margin-bottom:14px">
    <div class="w-h"><span class="wi">${IC.corona}</span><h3>Tu nivel y tu XP</h3><span class="c">Nv ${p.nivel}</span></div>
    <div class="w-body">
      <div class="row wrap g8" style="justify-content:space-between; margin-bottom:8px">
        <span class="num" style="font-size:22px">${fmt(p.xp)} XP</span>
        <span class="sub">${falta>0?`Faltan ${fmt(falta)} XP para el nivel ${p.nivel+1}`:"Nivel máximo alcanzado con esta configuración"}</span>
      </div>
      <span class="bar-track" style="display:block"><span class="bar-fill c-xp" style="width:${pct.toFixed(0)}%"></span></span>
      <div class="sub" style="margin-top:8px">La XP solo sube — no se gasta ni baja. El nivel abre catálogo, no da Oro.</div>
    </div>
  </section>`;
}

const agotado = i => i.cuposDisponibles !== null && i.cuposDisponibles !== undefined && Number(i.cuposDisponibles) <= 0;

    : `<span class="chip ${agotado(i)?"risk":Number(i.cuposDisponibles)<=2?"gold":""}">${agotado(i)?"Agotado este mes":`Quedan ${fmt(i.cuposDisponibles)} de ${fmt(i.cuposTotales)}`}</span>`;

      <button class="btn sm ${caro||agotado(i)?"":"gold"}" data-pedir="${esc(i.id)}" ${caro||agotado(i)?"disabled":""}>
        ${agotado(i)?"Agotado":caro?`Faltan ${fmt(i.precioOro - D.saldo)}`:verboItem(i)}

/* =========================================================
   VISTA · RANKING
   -------------------------------------------------------
   Conectada el 16/09 a `GET /economy/ranking` (construido el
   14/09). La duda de R-07 se resolvió ese día: R-07 protege
   superficies de GESTIÓN; esto es entre compañeros, dentro
   de la app del empleado, y ya estaba en el Maestro §4.3
   ("±3 por defecto, tabla completa opt-in"). El servidor
   aplica las tres reglas — juego apagado, no participar,
   ±3 — y esta pantalla solo dibuja lo que le llega.
   ========================================================= */
function vistaRanking(){
  const R = D.ranking;
  const prefs = { verTabla: !!(R && R.prefs && R.prefs.verTablaCompleta) };
  const ambito = state.rankingAmbito || "global";
  const cab = `<div class="page-h"><div><span class="eyebrow">Entre todos</span><h1>Ranking</h1></div>
    ${(D.membresia && D.membresia.areaId) ? `<div class="seg"><button data-ranking-ambito="global" aria-pressed="${ambito==="global"}">Toda la empresa</button><button data-ranking-ambito="area" aria-pressed="${ambito==="area"}">Mi área</button></div>` : ""}
  </div>`;

  if(!R) return cab + `<div class="card empty">El ranking no cargó. Reintenta en un momento.</div>`;

  if(!R.participo){
    return cab + `
    <section class="w">
      <div class="w-h"><span class="wi">${IC.ranking}</span><h3>No estás en el ranking</h3></div>
      <div class="w-body">
        <div class="note">${optIn()
          ? "Elegiste no aparecer. Sigues jugando y ganando Oro igual — solo no sales en la tabla de nadie ni ves la de nadie."
          : "Tienes el juego apagado. Con el juego apagado no hay ranking (es la misma regla que apaga el Oro)."}</div>
        ${optIn()?`<button class="btn primary" style="margin-top:12px" data-ranking-pref="participaEnRanking" data-valor="true">Volver a aparecer</button>`:""}
      </div>
    </section>`;
  }

  const maxXp = Math.max(1, ...R.tabla.map(f=>f.xp||0));
  const filas = R.tabla.map(f=>{
    const yo = f.membershipId===mid();
    return `<div class="estado-row ${yo?"me":""}" style="${yo?"outline:2px solid var(--gold); outline-offset:-2px":""}">
      <span class="bl"><b class="num">#${f.posicion}</b> ${esc(yo?"Tú":f.nombre)} <span class="sub">· Nv ${f.nivel}</span></span>
      <span class="bar-track"><span class="bar-fill c-xp" style="width:${((f.xp||0)/maxXp*100).toFixed(0)}%"></span></span>
      <span class="bv num">${fmt(f.xp)} XP</span>
    </div>`;
  }).join("");

  return cab + `
  <div class="stat-strip" style="margin-bottom:14px">
    <div class="stat"><div class="l">Tu puesto</div><div class="v">${R.miPosicion?`#${R.miPosicion}`:"—"}</div></div>
    <div class="stat"><div class="l">En la tabla</div><div class="v">${R.tabla.length}</div></div>
    <div class="stat"><div class="l">Se ordena por</div><div class="v" style="font-size:14px">XP</div></div>
  </div>

async function aceptarMision(id){
  try{
    const m = await LevelopAPI.misiones.aceptar(id);
    const i = D.misiones.findIndex(x=>x.id===id);
    if(i>=0) D.misiones[i] = m;
    cerrarModal(); render();
    toast("ok","check","Aceptaste la misión","Ahora sí va a dar Oro cuando se cierre.");
  }catch(e){ avisarError(e, "aceptar"); }
}

async function cerrarMision(id){
  const m = D.misiones.find(x=>x.id===id);
  try{
    /* Se manda la hora del cliente a propósito: el servidor la compara con la
       suya y rechaza una deriva grande. Si el reloj del teléfono está mal, el
       usuario tiene que enterarse, no que le cuadren las cuentas en silencio. */
    const r = await LevelopAPI.misiones.cerrar(id, {clientOccurredAt: new Date().toISOString()});
    await Promise.all([
      LevelopAPI.misiones.listar().then(l=>{ D.misiones = Array.isArray(l)?l:D.misiones; }),
      refrescarSaldo()
    ]);
    cerrarModal(); render();

    if(r && typeof r.oroOtorgado === "number"){
      if(r.oroOtorgado === 0 && !daraOro(m||{})){
        toast("ok","check","Misión cerrada", `+${r.xp} XP. Sin Oro: nadie más la había aceptado, y esa es la regla.`, 6000);
      } else if(r.oroOtorgado < r.oro){
        toast("ok","alerta","Misión cerrada", `+${r.xp} XP y +${r.oroOtorgado} de Oro. Te tocaban ${r.oro}, pero llegaste al tope de Oro del día — el resto no se pierde por tu lado, simplemente hoy no cabía más.`, 7000);
      } else {
        toast("ok","check","Misión cerrada", `+${r.xp} XP y +${r.oroOtorgado} de Oro.`, 5200);
      }
    } else {
      toast("ok","check","Misión cerrada","Listo.");
    }
  }catch(e){ avisarError(e, "cerrar"); }
}

async function crearMision(){
  const titulo = document.getElementById("nt").value.trim();
  if(!titulo){ toast("risk","alerta","Falta el título","Escribe qué hay que hacer para poder montarla."); return; }
  const g = id => document.querySelector(`#${id} [aria-pressed="true"]`).dataset.v;
  const fechaEl = document.getElementById("nd").value;
  const limite = fechaEl ? new Date(fechaEl + "T23:59:00") : new Date(Date.now() + 5*24*H);
  if(isNaN(limite.getTime()) || limite.getTime() < Date.now()){ toast("risk","alerta","Fecha inválida","Elige una fecha de entrega de hoy en adelante."); return; }
  const desc = document.getElementById("ndesc").value.trim();

  const dto = {
    titulo,
    urgencia: g("nurg"),
    importancia: g("nimp"),
    esfuerzo: g("nesf"),
    fechaLimite: limite.toISOString()
  };
  if(desc) dto.descripcion = desc;
  /* Solo se manda `areaId` si la membresía tiene una: el DTO lo valida como
     UUID y mandar null lo haría fallar la validación entera. Misma regla
     para `asignadoMembershipId`. */
  if(D.membresia && D.membresia.areaId) dto.areaId = D.membresia.areaId;
  const sug = (document.getElementById("nsug")||{}).value;
  if(sug && sug!==mid()) dto.asignadoMembershipId = sug;
  const paraMi = sug && sug===mid();
  const links = String((document.getElementById("nlinks")||{}).value||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(links.length) dto.enlaces = links;

  try{
    const m = await LevelopAPI.misiones.crear(dto);
    D.misiones.unshift(m);
    cerrarModal(); state.tab="misiones"; state.filtro="mias"; render();
    toast("ok","check","Misión montada", paraMi ? "Quedó tuya. Da XP al cerrarla; para que dé Oro, otra persona tiene que aceptarla." : sug ? `Le llegó un aviso a ${nombreDe(sug)}. Para que dé Oro, tiene que aceptarla.` : "Para que dé Oro, otra persona tiene que aceptarla.", 5400);
  }catch(e){ avisarError(e, "crear"); }
}

              : "Dejas de ganar Oro nuevo. Tu saldo sigue caducando a los 90 días como el de todos. Lo del trabajo sigue igual.", 6500);
  }catch(e){ avisarError(e, "juego"); }
}

/* 17/09 — BUG REAL (reportado por Alim: "hice una compra y no se realizó el
   débito" + "auto-confirma pero salió 'queda en proceso'"): la app no mandaba
   clave de idempotencia, el servidor usaba una por (persona, ítem, día), y el
   segundo pedido del mismo ítem en el día devolvía el PRIMERO sin debitar —
   y esta función lo anunciaba como nuevo. Ahora: una clave nueva por clic
   (se reutiliza solo si ese mismo clic se reintenta), y el mensaje sale del
   estado real que devuelve el servidor. */
let claveEnCurso = null;
async function pedirBeneficio(itemId){
  const item = D.catalogo.find(i=>i.id===itemId);
  if(!claveEnCurso || claveEnCurso.itemId!==itemId){
    const k = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    claveEnCurso = {itemId, k};
  }
  try{
    const r = await LevelopAPI.tienda.solicitar(itemId, claveEnCurso.k);
    claveEnCurso = null;
    D.saldo = (r && typeof r.saldoRestante === "number") ? r.saldoRestante : D.saldo;
    const [canjes, catalogo] = await Promise.all([LevelopAPI.tienda.misCanjes(), LevelopAPI.tienda.catalogo()]);
    D.canjes = Array.isArray(canjes) ? canjes : D.canjes;
    D.catalogo = Array.isArray(catalogo) ? catalogo : D.catalogo;
    cerrarModal(); render();
    const nombre = item?item.nombre:"El beneficio";
    if(r && r.duplicado){
      toast("ok","ticket","Ya lo tenías pedido", `${nombre} ya estaba ${r.estado==="CONFIRMADO"?"confirmado":"en proceso"} — no se volvió a cobrar. Tu Oro: ${fmt(D.saldo)}.`, 6000);
    } else if(r && r.estado==="CONFIRMADO"){
      toast("ok","check","¡Es tuyo!", `${nombre} quedó confirmado al instante. Te quedan ${fmt(D.saldo)} de Oro.`, 5600);
    } else {
      toast("ok","ticket","Solicitud registrada", `${nombre} queda en proceso hasta que lo confirmen. Se descontó el Oro: te quedan ${fmt(D.saldo)}.`, 5600);
    }
  }catch(e){
    /* El backend devuelve el motivo tipificado. Si es CUPO_AGOTADO o
       SALDO_INSUFICIENTE, el Oro NO se tocó — y eso hay que decirlo,
       porque es justo lo que la persona teme. */
    avisarError(e, "canje");
    try{ await refrescarSaldo(); render(); }catch(_){}
  }
}

document.addEventListener("click", e=>{
  const dentroAvisos = e.target.closest("#avisosdrop, #bell");
  if(!dentroAvisos) toggleAvisos(false);

  const t = e.target.closest("[data-tab],[data-periodo],[data-filtro],[data-filtro-ir],[data-mision],[data-cerrar],[data-aceptar],[data-cerrarmision],[data-shopfam],[data-pedir],[data-confirmar],[data-reglas],[data-plegar],[data-nueva],[data-crear],[data-info],[data-recargar],[data-salir],[data-leer],[data-optin],[data-ranking-pref],[data-ranking-ambito],#bell,#themebtn,[data-stop]");
  if(!t) return;

  const lv = e.target.closest("[data-leer-varios]"); if(lv){ marcarLeidos(lv.dataset.leerVarios.split(",")); }
  /* 16/09 — avisos, interruptor del juego, prefs del ranking */
  if(t.hasAttribute("data-leer")){ leerAviso(t.dataset.leer, t.dataset.avisoMision||null); return; }
  if(t.hasAttribute("data-optin")){ cambiarJuego(t.dataset.optin==="true"); return; }
  if(t.hasAttribute("data-ranking-pref")){ cambiarPrefRanking(t.dataset.rankingPref, t.dataset.valor==="true"); return; }
  if(t.hasAttribute("data-ranking-ambito")){ cambiarAmbitoRanking(t.dataset.rankingAmbito); return; }

  if(t.id==="themebtn"){
    const cur = document.documentElement.getAttribute("data-theme")||"dark";
    const nuevo = cur==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nuevo);
    try{ localStorage.setItem("lvl-tema", nuevo); }catch(err){}
    return;
  }
  if(t.id==="bell"){ toggleAvisos(); return; }
  if(t.hasAttribute("data-stop")) return;

  if(t.dataset.info){ abrirModal(modalInfo(t.dataset.info)); return; }
  if(t.hasAttribute("data-salir")){ LevelopAPI.salir(); return; }
  if(t.hasAttribute("data-recargar")){ cargarTodo(); return; }

  if(t.hasAttribute("data-tab")){ cerrarModal(); state.tab=t.dataset.tab; render(); return; }
  if(t.hasAttribute("data-periodo")){ state.periodo=t.dataset.periodo; render(); return; }
  if(t.hasAttribute("data-filtro")){ state.filtro=t.dataset.filtro; render(); return; }
  if(t.hasAttribute("data-filtro-ir")){ state.tab="misiones"; state.filtro=t.dataset.filtroIr; render(); return; }
  if(t.hasAttribute("data-shopfam")){ state.shopFamilia=t.dataset.shopfam; render(); return; }
  if(t.hasAttribute("data-plegar")){ const k=t.dataset.plegar; state.plegado[k]=!state.plegado[k]; render(); return; }

  if(t.hasAttribute("data-mision")){
    const m = D.misiones.find(x=>String(x.id)===t.dataset.mision);
    if(m){ state.abierta=m.id; abrirModal(detalleMision(m)); }
    return;
  }
  if(t.hasAttribute("data-cerrar")){ cerrarModal(); state.abierta=null; return; }
  if(t.hasAttribute("data-aceptar")){ aceptarMision(t.dataset.aceptar); return; }
  if(t.hasAttribute("data-cerrarmision")){ cerrarMision(t.dataset.cerrarmision); return; }

  if(t.hasAttribute("data-nueva")){ abrirModal(modalNueva()); return; }
  if(t.hasAttribute("data-crear")){ crearMision(); return; }

  if(t.hasAttribute("data-pedir")){
    const i = D.catalogo.find(x=>String(x.id)===t.dataset.pedir);
    if(i) abrirModal(modalPedir(i));
    return;
  }
  if(t.hasAttribute("data-confirmar")){ pedirBeneficio(t.dataset.confirmar); return; }
  if(t.hasAttribute("data-reglas")){ abrirModal(modalReglas()); return; }
});

      <div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <h1>Entrar</h1>
      <p class="sub">Con el mismo correo que cargó tu empresa.</p>
      ${error?`<div class="auth-err" style="margin-top:16px">${esc(error)}</div>`:""}
      <form class="auth-f" id="loginform">
        <div class="field"><label>Correo</label>
          <input id="lemail" type="email" autocomplete="username" required placeholder="tu@empresa.com"></div>
        <div class="field"><label>Contraseña</label>
          <input id="lpass" type="password" autocomplete="current-password" required minlength="8"></div>
        ${tenantEnURL?`<div class="note">Se va a usar el tenant que viene en la dirección: <b class="num">${esc(tenantEnURL.slice(0,8))}…</b></div>`:""}
        <button class="btn primary wide" id="lbtn" type="submit">Entrar</button>
      </form>
    </div>`;
  document.getElementById("loginform").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const btn = document.getElementById("lbtn");
    btn.disabled = true; btn.textContent = "Entrando…";
    try{
      const r = await LevelopAPI.login(
        document.getElementById("lemail").value.trim(),
        document.getElementById("lpass").value
      );
      await resolverTenant(r.membresias, tenantEnURL);
    }catch(err){
      btn.disabled = false; btn.textContent = "Entrar";
      pintarLogin(
        err && err.status === 401 ? "Correo o contraseña incorrectos."
        : err && err.message ? `No se pudo entrar: ${err.message}`
        : "No se pudo conectar con el servidor. ¿Está corriendo el backend?"
      );
    }
  });
}

async function resolverTenant(membresias, tenantEnURL){
  /* Caso normal: el endpoint respondió. */
  if(Array.isArray(membresias)){
    if(membresias.length === 0){
      LevelopAPI.logout();
      return pintarLogin("Tu cuenta existe pero no está activa en ninguna empresa. Habla con RRHH de tu empresa.");
    }
    if(membresias.length === 1){ return entrar(membresias[0]); }
    return pintarPicker(membresias);
  }

  /* Plan B: el backend no tiene todavía `GET /auth/mis-membresias`
     (no se ha reiniciado). No se inventa nada: se dice qué pasa. */
  const id = tenantEnURL || (D.membresia && D.membresia.tenantId) || LevelopAPI.sesion.getTenantId();
  if(id){
    LevelopAPI.fijarTenant(id);
    return entrar({tenantId:id, tenantNombre:"(sin confirmar)", membershipId:null, usuarioNombre:"", zona:"—", optInJuego:true}, true);
  }
  A.innerHTML = `
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <h1>Falta un dato</h1>
      <div class="auth-err" style="margin-top:14px">
        Entraste bien, pero este backend todavía no tiene el endpoint que dice a qué empresa perteneces
        (<b>GET /auth/mis-membresias</b>). Reinicia el backend y vuelve a entrar, o pega el identificador de la empresa aquí abajo.
      </div>
      <form class="auth-f" id="tform">
        <div class="field"><label>Identificador de la empresa</label>
          <input id="tid" placeholder="00000000-0000-0000-0000-000000000000" required></div>
        <button class="btn primary wide" type="submit">Continuar</button>
      </form>
    </div>`;
  document.getElementById("tform").addEventListener("submit", ev=>{
    ev.preventDefault();
    const v = document.getElementById("tid").value.trim();
    if(!v) return;
    LevelopAPI.fijarTenant(v);
    entrar({tenantId:v, tenantNombre:"(sin confirmar)", membershipId:null, usuarioNombre:"", zona:"—", optInJuego:true}, true);
  });
}

function pintarPicker(membresias){
  A.innerHTML = `
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <h1>¿Cuál empresa?</h1>
      <p class="sub">Tu cuenta está activa en más de una.</p>
      <div class="auth-pick" style="margin-top:18px">
        ${membresias.map((m,i)=>`<button data-pick="${i}">
          <span class="av sm" style="background:#0C6E78">${esc(iniciales(m.tenantNombre))}</span>
          <span style="flex:1; min-width:0">
            <span style="display:block; font-size:14px; font-weight:600">${esc(m.tenantNombre)}</span>
            <span class="mini-x">${esc(m.rol)}${m.areaNombre?" · "+esc(m.areaNombre):""}</span>
          </span>
        </button>`).join("")}
      </div>
    </div>`;
  A.querySelectorAll("[data-pick]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const m = membresias[+b.dataset.pick];
      LevelopAPI.fijarTenant(m.tenantId);
      entrar(m);
    });
  });
}

function entrar(membresia, sinConfirmar){
  D.membresia = membresia;
  A.classList.add("hide");
  document.getElementById("app").classList.remove("hide");
  document.getElementById("tabbar").classList.remove("hide");
  if(sinConfirmar){
    toast("risk","alerta","Entraste sin confirmar la empresa",
      "El backend no devolvió tus membresías, así que no pude verificar a qué empresa perteneces. Reinícialo para que esto deje de pasar.", 9000);
  }
  cargarTodo();
}

/* =========================================================
   INVITACIÓN (16/09/26) — el único camino de alta.
   -------------------------------------------------------
   `levelop-mvp.html?invitacion=TOKEN`. Primero se le pide al
   servidor qué dice el link (empresa, rol, área, si sigue
   vivo, si el correo ya tiene cuenta) y recién después se
   pide lo mínimo: nombre + contraseña si es correo nuevo,
   solo contraseña si ya es usuario de otra empresa. La
   contraseña la escribe la persona; ni gerencia ni Levelop
   la ven nunca.
   ========================================================= */
const ROL_TXT = {empleado:"Empleado", lider_area:"Líder de área", gerencia:"Gerencia", admin_tenant:"Administrador"};
async function pintarInvitacion(token){
  A.innerHTML = `<div class="auth-card"><div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div><h1>Un momento…</h1><p class="sub">Leyendo tu invitación.</p></div>`;
  let inv;
  try{ inv = await LevelopAPI.verInvitacion(token); }
  catch(e){
    return A.innerHTML = `<div class="auth-card"><div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <h1>Esta invitación no sirve</h1>
      <div class="auth-err" style="margin-top:14px">${e && e.status===404 ? "El link no corresponde a ninguna invitación. Pídele a tu empresa que te mande uno nuevo." : esc((e&&e.message)||"No se pudo leer la invitación.")}</div>
      <button class="btn wide" style="margin-top:14px" onclick="location.search=''">Ir a entrar</button></div>`;
  }
  if(inv.yaAceptada || inv.vencida){
    return A.innerHTML = `<div class="auth-card"><div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <h1>${inv.yaAceptada?"Ya usaste esta invitación":"Esta invitación venció"}</h1>
      <p class="sub" style="margin-top:8px">${inv.yaAceptada?"Entra con tu correo y tu contraseña.":"Los links duran 14 días. Pídele a tu empresa que te mande uno nuevo."}</p>
      <button class="btn primary wide" style="margin-top:16px" onclick="location.search=''">Ir a entrar</button></div>`;
  }
  const rol = ROL_TXT[inv.rol] || inv.rol;
  A.innerHTML = `
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">L</span>Levelop<em>!</em></div>
      <span class="eyebrow">Te invitaron</span>
      <h1 style="margin-top:4px">${esc(inv.tenantNombre||"Tu empresa")}</h1>
      <p class="sub">Como <b>${esc(rol)}</b>${inv.areaNombre?` en <b>${esc(inv.areaNombre)}</b>`:""}${inv.zona?` · ${esc(inv.zona)}`:""}.</p>
      <form class="auth-f" id="invform" style="margin-top:16px">
        <div class="field"><label>Correo</label><input type="email" value="${esc(inv.email)}" disabled></div>
        ${inv.usuarioExiste
          ? `<div class="note">Ese correo ya tiene cuenta en Levelop (en otra empresa). Escribe <b>tu contraseña de siempre</b> y te sumamos a esta empresa con la misma cuenta.</div>`
          : `<div class="field"><label>Tu nombre</label><input id="inombre" autocomplete="name" required minlength="2" maxlength="120" placeholder="Nombre y apellido"></div>`}
        <div class="field"><label>${inv.usuarioExiste?"Tu contraseña":"Elige una contraseña"}</label>
          <input id="ipass" type="password" autocomplete="${inv.usuarioExiste?"current-password":"new-password"}" required minlength="8" placeholder="Mínimo 8 caracteres"></div>
        <div id="inverr"></div>
        <button class="btn primary wide" id="ibtn" type="submit">${inv.usuarioExiste?"Sumarme a esta empresa":"Crear mi cuenta y entrar"}</button>
      </form>
      <div class="sub" style="margin-top:12px">El link vence ${esc(fecha(new Date(inv.expiraAt)))}. Tu contraseña la sabes solo tú — no la ve tu empresa ni Levelop.</div>
    </div>`;
  document.getElementById("invform").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const btn = document.getElementById("ibtn"); btn.disabled = true; btn.textContent = "Entrando…";
    const nombreEl = document.getElementById("inombre");
    try{
      const r = await LevelopAPI.aceptarInvitacion(token, {
        nombre: nombreEl ? nombreEl.value.trim() : undefined,
        password: document.getElementById("ipass").value
      });
      history.replaceState(null, "", location.pathname);
      const ms = await LevelopAPI.misMembresias();
      const m = (Array.isArray(ms) && ms.find(x=>x.tenantId===r.tenantId)) || null;
      if(m){ LevelopAPI.fijarTenant(m.tenantId); entrar(m); toast("ok","check",`Bienvenido a ${m.tenantNombre}`,"Ya estás adentro. Lo primero que ves son las misiones abiertas de tu empresa.", 7000); }
      else pintarLogin("Tu cuenta quedó creada. Entra con tu correo y contraseña.");
    }catch(err){
      btn.disabled = false; btn.textContent = "Reintentar";
      const msg = err && err.motivoRechazo==="INVITACION_USADA" ? "Esta invitación ya fue usada."
        : err && err.motivoRechazo==="INVITACION_VENCIDA" ? "Esta invitación venció."
        : err && err.status===401 ? "Esa no es la contraseña de tu cuenta."
        : (err && err.message) || "No se pudo completar.";
      document.getElementById("inverr").innerHTML = `<div class="auth-err">${esc(msg)}</div>`;
    }
  });
}

/* Arranque: si ya había sesión en esta pestaña, se reusa. */
(async function arrancar(){
  const invToken = new URLSearchParams(location.search).get("invitacion");
  if(invToken){ LevelopAPI.logout(); return pintarInvitacion(invToken); }
  if(LevelopAPI.sesion.haySesion()){
    try{
      const ms = await LevelopAPI.misMembresias();
      const fijado = LevelopAPI.sesion.getTenantId();
      const m = (Array.isArray(ms) && (ms.find(x=>x.tenantId===fijado) || (ms.length===1?ms[0]:null))) || null;
      if(m){ LevelopAPI.fijarTenant(m.tenantId); return entrar(m); }
      if(Array.isArray(ms) && ms.length>1) return pintarPicker(ms);
    }catch(e){ /* sesión vencida o backend caído: se pide login otra vez */ }
    LevelopAPI.logout();
  }
  pintarLogin();
})();

})();
</script>
