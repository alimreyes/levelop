<title>Levelop MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">

<script>
/* Oscuro por defecto. Se aplica antes de pintar para que no haya parpadeo. */
try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("lvl-tema") || "dark"); }
catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
</script>

<style>
/* =========================================================
   LEVELOP! — sistema visual "arcade de oficina"
   Negro, lima y blanco. Todo cuadra a una rejilla de 4 px:
   esquinas escalonadas de pixel-art, reglas de bloques,
   medidores de barras. Es un juego, pero uno que lleva
   cuentas de verdad.
   ========================================================= */

/* ---------- TOKENS · claro ---------- */
:root{
  --ground:#EAEAE4; --surface:#FFFFFF; --surface-2:#F1F1EB; --surface-3:#DFDFD7;
  --line:#D0D0C8; --line-strong:#ABABA1;
  --ink:#0B0B0C; --ink-2:#4A4A47; --ink-3:#7A7A75;
  --grid:rgba(11,11,12,.055);

  /* Oro = lima. Es la moneda y es la marca: un solo color fuerte. */
  --gold:#4E6606; --gold-ink:#3C5004; --gold-bg:#E7F7B7; --gold-line:#C4E273; --gold-solid:#C3F03A;
  /* XP = tinta. En el juego, la experiencia no tiene color: tiene peso. */
  --xp:#0B0B0C;   --xp-bg:#E2E2DB;   --xp-line:#BEBEB4;  --xp-solid:#0B0B0C;
  --ok:#0A6B7A;   --ok-bg:#D7EFF4;   --ok-line:#9BD2DE;
  --risk:#C0361F; --risk-bg:#FADFD9; --risk-line:#EEAE9F;
  --sync:#4A38C4; --sync-bg:#E2DEFA; --sync-line:#B4ABF0;

  --shadow:4px 4px 0 rgba(11,11,12,.10);
  --shadow-lg:8px 8px 0 rgba(11,11,12,.18);

  --display:'Silkscreen','Courier New',monospace;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'Space Mono','SFMono-Regular',Consolas,monospace;
}
/* ---------- TOKENS · oscuro (el modo por defecto) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#08080A; --surface:#121215; --surface-2:#1A1A1E; --surface-3:#26262C;
    --line:#2A2A31; --line-strong:#43434E;
    --ink:#EDEDE7; --ink-2:#9B9B95; --ink-3:#6A6A66;
    --grid:rgba(237,237,231,.045);
    --gold:#C3F03A; --gold-ink:#D6F871; --gold-bg:#2A3607; --gold-line:#4A5F0D; --gold-solid:#C3F03A;
    --xp:#EDEDE7;   --xp-bg:#26262C;   --xp-line:#43434E;  --xp-solid:#EDEDE7;
    --ok:#4FD8E8;   --ok-bg:#0A2C33;   --ok-line:#18505C;
    --risk:#FF6A52; --risk-bg:#331310; --risk-line:#57241D;
    --sync:#A79AFF; --sync-bg:#1D1846; --sync-line:#332B70;
    --shadow:4px 4px 0 rgba(0,0,0,.5);
    --shadow-lg:8px 8px 0 rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#08080A; --surface:#121215; --surface-2:#1A1A1E; --surface-3:#26262C;
  --line:#2A2A31; --line-strong:#43434E;
  --ink:#EDEDE7; --ink-2:#9B9B95; --ink-3:#6A6A66;
  --grid:rgba(237,237,231,.045);
  --gold:#C3F03A; --gold-ink:#D6F871; --gold-bg:#2A3607; --gold-line:#4A5F0D; --gold-solid:#C3F03A;
  --xp:#EDEDE7;   --xp-bg:#26262C;   --xp-line:#43434E;  --xp-solid:#EDEDE7;
  --ok:#4FD8E8;   --ok-bg:#0A2C33;   --ok-line:#18505C;
  --risk:#FF6A52; --risk-bg:#331310; --risk-line:#57241D;
  --sync:#A79AFF; --sync-bg:#1D1846; --sync-line:#332B70;
  --shadow:4px 4px 0 rgba(0,0,0,.5);
  --shadow-lg:8px 8px 0 rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:32px 32px;
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold-solid); outline-offset:2px}
p{margin:0}
svg{display:block}

h1,h2,h3,h4{margin:0; font-family:var(--display); text-wrap:balance; text-transform:uppercase}
h1{font-weight:700; letter-spacing:.005em; line-height:.94}
h2{font-weight:700; letter-spacing:.01em; line-height:1}
h3,h4{font-weight:700; letter-spacing:0; line-height:1.12}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500; letter-spacing:-.01em}
.score{font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* La forma de la casa: octógono de pixel-art */
.px8{clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}

/* =========================================================
   SHELL
   ========================================================= */
.app{min-height:100vh; display:grid; grid-template-columns:1fr}
.rail{display:none}
.main{min-width:0; display:flex; flex-direction:column}

.topbar{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:2px solid var(--line)}
.topbar-in{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.topbar-spacer{flex:1}

.brand{display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:700;
  font-size:24px; text-transform:uppercase; letter-spacing:.01em; line-height:1}
.brand em{font-style:normal; color:var(--gold)}
.brand-mark{width:26px; height:26px; flex:none; display:grid; place-items:center; font-size:15px;
  font-weight:700; font-family:var(--display); color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}

.hudset{display:flex; align-items:center; gap:5px; min-width:0}
.hud{display:inline-flex; align-items:center; gap:6px; padding:5px 9px; background:var(--surface-2);
  border:1px solid var(--line); font-family:var(--mono); font-size:10px; white-space:nowrap; color:var(--ink-2)}
.hud .num{font-size:11.5px; color:var(--ink); font-weight:600}
.hud-l{font-size:8.5px; letter-spacing:-.01em; text-transform:uppercase; opacity:.8}
.hud.is-gold{background:var(--gold-bg); border-color:var(--gold-line); color:var(--gold-ink)}
.hud.is-gold .num{color:var(--gold)}
.hud.is-xp{background:var(--xp-bg); border-color:var(--xp-line); color:var(--ink-2)}
.hud.is-xp .num{color:var(--ink)}
.hud.is-streak{background:var(--risk-bg); border-color:var(--risk-line); color:var(--risk)}
.hud.is-streak .num{color:var(--risk)}
.hud-warn{font-size:8.5px; padding:1px 4px; background:var(--risk); color:#0B0B0C; font-weight:600}
button.hud{cursor:pointer}
button.hud:hover{border-color:var(--line-strong)}
.hud.is-zona svg{width:12px;height:12px;flex:none}
.zona-l{max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
button.chip{cursor:pointer; font:inherit; font-family:var(--mono); font-size:9.5px}
button.chip:hover{border-color:var(--line-strong)}
button.hud:hover{border-color:var(--gold-solid)}

.iconbtn{width:32px; height:32px; display:grid; place-items:center; position:relative; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line)}
.iconbtn:hover{color:var(--ink); border-color:var(--gold-solid)}
.iconbtn .ti{display:block; width:17px; height:17px}
.iconbtn .ti svg{width:100%; height:100%}
.dot{position:absolute; top:4px; right:4px; width:5px; height:5px; background:var(--risk)}

.content{max-width:1180px; margin:0 auto; width:100%; padding:20px 16px 106px; flex:1}

.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--surface);
  border-top:2px solid var(--line); display:flex; padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 1px; color:var(--ink-3);
  font-family:var(--mono); font-size:8px; letter-spacing:-.04em; text-transform:uppercase}
.tab .ti{display:block; width:20px; height:20px}
.tab .ti svg{width:100%; height:100%}
.tab[aria-current="page"]{color:var(--ink)}
.tab-mark{width:16px; height:4px; background:transparent}
.tab[aria-current="page"] .tab-mark{background:var(--gold-solid)}

@media (min-width:960px){
  .app{grid-template-columns:236px 1fr}
  .rail{display:flex; flex-direction:column; gap:3px; padding:18px 12px; background:var(--surface);
    border-right:2px solid var(--line); position:sticky; top:0; height:100vh}
  .rail .brand{padding:4px 8px 20px}
  .railbtn{display:flex; align-items:center; gap:10px; padding:10px 11px; color:var(--ink-2);
    font-family:var(--mono); font-size:10.5px; letter-spacing:0; text-transform:uppercase; text-align:left;
    border:1px solid transparent}
  .railbtn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--line)}
  .railbtn[aria-current="page"]{background:var(--gold-solid); color:#0B0B0C; border-color:var(--gold-solid); font-weight:600}
  .railbtn .ti{display:block; width:18px; height:18px}
  .railbtn .ti svg{width:100%; height:100%}
  .tabbar{display:none}
  .content{padding-bottom:52px}
  .topbar .brand{display:none}
}

/* =========================================================
   PRIMITIVAS
   ========================================================= */
.card{background:var(--surface); border:1px solid var(--line)}
.stack{display:flex; flex-direction:column}
.g6{gap:6px} .g8{gap:8px} .g9{gap:9px} .g10{gap:10px} .g12{gap:12px} .g14{gap:14px} .g16{gap:16px}
.row{display:flex; align-items:center}
.wrap{flex-wrap:wrap}

.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:9px;
  letter-spacing:.01em; text-transform:uppercase; color:var(--ink-3)}
.eyebrow::after{content:""; width:22px; height:4px;
  background-image:linear-gradient(90deg,var(--line-strong) 0 4px,transparent 4px 8px); background-size:8px 4px}

.page-h{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px}
.page-h h1{font-size:40px; margin-top:4px}
.sub{color:var(--ink-2); font-size:13px}
.sec-h{display:flex; align-items:center; gap:12px; margin:28px 0 12px}
.sec-h h2{font-size:19px; flex:none}
.sec-h .sub{order:3; text-align:right; flex:none; max-width:46%}
.sec-h::before{content:""; order:2; flex:1; height:4px; min-width:18px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px); background-size:8px 4px}
@media (max-width:700px){
  .sec-h{flex-wrap:wrap}
  .sec-h .sub{flex:1 0 100%; max-width:100%; text-align:left; order:3}
}

.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 7px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:0; white-space:nowrap; background:var(--surface-2); border:1px solid var(--line);
  color:var(--ink-2); text-transform:uppercase}
.chip svg{width:11px; height:11px; flex:none}
.chip.gold{background:var(--gold-bg); border-color:var(--gold-line); color:var(--gold-ink)}
.chip.xp  {background:var(--xp-bg);   border-color:var(--xp-line);   color:var(--ink)}
.chip.ok  {background:var(--ok-bg);   border-color:var(--ok-line);   color:var(--ok)}
.chip.risk{background:var(--risk-bg); border-color:var(--risk-line); color:var(--risk)}
.chip.sync{background:var(--sync-bg); border-color:var(--sync-line); color:var(--sync)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 14px;
  font-family:var(--mono); font-size:10px; letter-spacing:0; text-transform:uppercase; font-weight:500;
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  transition:background .1s steps(2), transform .06s steps(1)}
.btn svg{width:14px; height:14px}
.btn:hover{background:var(--surface-3); border-color:var(--gold-solid)}
.btn:active{transform:translate(1px,1px)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2); border-color:var(--ink-2)}
.btn.gold{background:var(--gold-solid); color:#0B0B0C; border-color:var(--gold-solid); font-weight:600}
.btn.gold:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.sm{padding:6px 9px; font-size:9px}
.btn.sm svg{width:12px; height:12px}
.btn.wide{width:100%}

.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); padding:2px; gap:2px}
.seg button{padding:6px 11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold-solid); color:#0B0B0C; font-weight:600}

.scroller{display:flex; gap:6px; overflow-x:auto; padding:0 16px 5px; margin:0 -16px; scrollbar-width:thin}
.fchip{padding:7px 11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0; text-transform:uppercase;
  color:var(--ink-2); background:var(--surface); border:1px solid var(--line); white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--gold-solid); border-color:var(--gold-solid); color:#0B0B0C; font-weight:600}

.av{width:30px; height:30px; flex:none; display:grid; place-items:center; font-family:var(--mono); font-size:9px;
  font-weight:600; color:#fff; letter-spacing:-.02em;
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.av.lg{width:72px; height:72px; font-size:22px; font-family:var(--display); font-weight:700; letter-spacing:.02em}
.av.sm{width:24px; height:24px; font-size:7.5px}
.avstack{display:flex}
.avstack .av{margin-left:-5px}
.avstack .av:first-child{margin-left:0}

.seal{width:60px; height:60px; flex:none; display:grid; place-items:center; color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.seal b{font-family:var(--display); font-weight:400; font-size:27px; line-height:1}
.seal i{font-style:normal; font-family:var(--mono); font-size:6.5px; letter-spacing:-.04em; text-transform:uppercase; opacity:.72}
.seal.sm{width:34px; height:34px}
.seal.sm b{font-size:15px}
.seal.sm i{display:none}

.meter{display:flex; gap:2px; align-items:stretch; height:12px}
.meter i{flex:1; background:var(--surface-3); transition:background .2s steps(2)}
.meter i.on{background:var(--xp-solid)}
.meter.gold i.on{background:var(--gold-solid)}
.meter.sm{height:8px}

.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:13px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.kv:last-child{background-image:none}
.kv span:first-child{color:var(--ink-2)}

.note{padding:11px 12px; font-size:12.5px; line-height:1.55; background:var(--surface-2);
  border:1px solid var(--line); border-left-width:4px; color:var(--ink-2)}
.note.sync{background:var(--sync-bg); border-color:var(--sync-line); border-left-color:var(--sync); color:var(--sync)}
.note.risk{background:var(--risk-bg); border-color:var(--risk-line); border-left-color:var(--risk); color:var(--risk)}
.note.gold{background:var(--gold-bg); border-color:var(--gold-line); border-left-color:var(--gold-solid); color:var(--gold-ink)}
.note.ok{background:var(--ok-bg); border-color:var(--ok-line); border-left-color:var(--ok); color:var(--ok)}
.note b{font-weight:700}
.empty{padding:28px 18px; text-align:center; color:var(--ink-3); font-size:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.01em}

/* =========================================================
   INICIO · bento
   ========================================================= */
.bento{display:grid; gap:10px; grid-template-columns:1fr}
@media (min-width:700px){.bento{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.bento{grid-template-columns:repeat(3,1fr)}}
.bento>*{min-width:0}
.w{display:flex; flex-direction:column; min-width:0; padding:14px 15px; background:var(--surface); border:1px solid var(--line)}
.w-h{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.w-h .wi{width:16px; height:16px; color:var(--gold); flex:none}
.w-h h3{font-size:15px; flex:1; min-width:0; overflow-wrap:anywhere}
.w-h .c{font-family:var(--mono); font-size:9px; color:var(--ink-3); flex:none}
.w-body{display:flex; flex-direction:column; gap:9px; flex:1; min-width:0}
@media (min-width:700px){ .w.x2{grid-column:span 2} }
@media (min-width:1080px){ .w.x3{grid-column:span 3} }
.mini{display:flex; gap:10px; align-items:flex-start; padding-bottom:9px; text-align:left; width:100%; min-width:0;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.mini:last-child{background-image:none; padding-bottom:0}
.mini-b{flex:1; min-width:0}
.mini-t{font-size:13.5px; font-weight:600; line-height:1.35; overflow-wrap:anywhere}
.mini-m{display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap; min-width:0}
.mini-x{font-family:var(--mono); font-size:8.5px; color:var(--ink-3); letter-spacing:0;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase}

.saludo{padding:18px; background:var(--surface); border:2px solid var(--ink); box-shadow:var(--shadow); margin-bottom:16px}
.saludo h1{font-size:32px}
@media (min-width:700px){.saludo h1{font-size:44px}}
.pixels{display:flex; gap:3px; margin-bottom:12px}
.pixels i{width:8px; height:8px; background:var(--gold-solid); display:block}
.pixels i:nth-child(4){background:var(--line-strong)}
.pixels i:nth-child(5){background:var(--line-strong); opacity:.5}

.news{display:flex; gap:11px; align-items:flex-start; padding:11px 0;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:bottom}
.news:last-child{background-image:none}
.news-i{width:32px; height:32px; flex:none; display:grid; place-items:center; color:#0B0B0C; background:var(--gold-solid);
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 75%,75% 75%,75% 100%,25% 100%,25% 75%,0 75%)}
.news-i svg{width:15px; height:15px}
.news-i.lvl{color:var(--ink); background:var(--surface-3)}
.news-t{font-size:13.5px; font-weight:600; line-height:1.35}
.news-d{font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.5}

/* =========================================================
   MISIONES
   ========================================================= */
.mission{display:block; width:100%; text-align:left; padding:14px 15px; background:var(--surface);
  border:1px solid var(--line); transition:border-color .1s steps(2), transform .06s steps(1)}
.mission:hover{border-color:var(--gold-solid); transform:translate(-1px,-1px); box-shadow:var(--shadow)}
.mission-top{display:flex; gap:11px; align-items:flex-start; margin-bottom:10px}
.mission h3{font-size:17px; flex:1; line-height:1.15}
.mission-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:11px}
.mission-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:10px;
  background-image:linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  background-size:8px 2px; background-repeat:repeat-x; background-position:top}
.rewards{display:flex; gap:6px; align-items:center}
.area-tag{font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:0; color:var(--ink-3)}
.thread-count{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--ink-3)}
.thread-count svg{width:13px; height:13px}

const BASE_XP = 40, ORO_POR_XP = .4, TOPE_DIA = 150, DECAY_DIAS = 90;
const calcXP  = m => Math.round(BASE_XP*MULT.urg[m.urg]*MULT.imp[m.imp]*MULT.esf[m.esf]);
const calcOro = m => Math.round(calcXP(m)*ORO_POR_XP);
missions.forEach(m=>{ m.xp=calcXP(m); m.oro=calcOro(m); });

/* --- Reparto: el responsable se lleva más, siempre --- */
const REPARTO_RESP = .60;
function reparto(m){
  const equipo = [m.resp, ...m.col];
  if(equipo.length===1) return [{id:m.resp, rol:"Responsable", pct:1, xp:m.xp, oro:m.oro}];
  const resto = (1-REPARTO_RESP)/m.col.length;
  return equipo.map((id,i)=>{
    const pct = i===0 ? REPARTO_RESP : resto;
    return {id, rol: i===0?"Responsable":"Colaborador", pct,
            xp: Math.round(m.xp*pct), oro: Math.round(m.oro*pct)};
  });
}
/* --- Recompensa sugerida al pedir ayuda: 15% del Oro de la misión, entre 10 y 80 --- */
const oroSugerido = m => Math.max(10, Math.min(80, Math.round(m.oro*0.15)));

const xpParaNivel = n => Math.round(280*Math.pow(n,1.62));
function nivelDe(xp){ let n=1; while(xp>=xpParaNivel(n+1)) n++; return n; }

/* =========================================================
   UTILIDADES
   ========================================================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pctify = s => String(s).replace(/%/g, '<span class="pct">%</span>');
const fmt = n => n.toLocaleString("es-VE");
const av  = (p,cls="") => `<span class="av ${cls}" style="background:${p.id===1?state.color:p.color}">${p.ini}</span>`;
const nom = id => id===1 ? state.nombre : P(id).n;
const MESES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fecha = d => `${String(d.getDate()).padStart(2,"0")} ${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
const fechaLarga = d => `${d.getDate()} de ${MESES_L[d.getMonth()]}`;

/* Hoy y mañana en palabras; de ahí en adelante, la fecha real (pedido de Alim) */
function restante(ms){
  if(ms < 0){
    const h = Math.round(-ms/H);
    return {txt: h<24 ? `Se venció hace ${h} h` : `Se venció hace ${Math.round(h/24)} d`, tipo:"risk"};
  }
  const h = ms/H;
  if(h < 1)  return {txt:`Quedan ${Math.max(1,Math.round(h*60))} min`, tipo:"risk"};
  if(h < 12) return {txt:`Quedan ${Math.round(h)} h`, tipo:"risk"};
  if(h < 24) return {txt:"Se vence hoy", tipo:"gold"};
  if(h < 48) return {txt:"Se vence mañana", tipo:"gold"};
  return {txt:`Entrega ${fechaLarga(new Date(Date.now()+ms))}`, tipo:""};
}
const haceRato = h => h<1 ? "ahorita" : h<24 ? `hace ${h} h` : `hace ${Math.round(h/24)} d`;
const ESTADOS = {
  proxima:{n:"Por arrancar",c:""}, curso:{n:"En curso",c:"xp"}, revision:{n:"En revisión",c:"gold"},
  riesgo:{n:"En riesgo",c:"risk"}, completada:{n:"Lista",c:"ok"}
};

function meter(actual, total, cls=""){
  const pips=14, on=Math.max(0,Math.min(pips,Math.round(actual/total*pips)));
  let h=`<span class="meter ${cls}">`;
  for(let i=0;i<pips;i++) h += `<i class="${i<on?"on":""}"></i>`;
  return h+"</span>";
}
function toast(tipo, ico, t, d, ms=4400){
  const el=document.createElement("div");
  el.className="toast "+tipo;
  el.innerHTML=`<span class="ti">${IC[ico]||IC.check}</span><div><div class="tt">${esc(t)}</div><div class="td">${esc(d)}</div></div>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),320); }, ms);
}
const zonaOk = x => x.zonas==="todas" || x.zonas.includes(state.zona);
function gateAbierto(g){
  if(!g) return true;
  if(g.t==="nivel")  return nivelDe(state.xp) >= g.v;
  if(g.t==="medalla") return equipoTiene(g.v);
  return true;
}
function gateTexto(g){
  if(g.t==="nivel") return `Nivel ${g.v}`;
  const m = medallasEquipo.find(x=>x.id===g.v);
  return `Medalla «${m.n}»`;
}
function gateComoLograrlo(g){
  if(g.t==="nivel"){
    const falta = xpParaNivel(g.v) - state.xp;
    return falta>0 ? `Te faltan ${fmt(falta)} XP para el nivel ${g.v}.` : `Ya tienes el nivel ${g.v}.`;
  }
  const m = medallasEquipo.find(x=>x.id===g.v);
  return m.got ? `El equipo ya la tiene.` : `El equipo va ${m.prog[0]} de ${m.prog[1]}: ${esc(m.d)}`;
}
const ultimoMsg = m => m.msgs.length ? Math.min(...m.msgs.map(x=>x.h)) : 9999;
const meNombran = m => m.msgs.filter(x=>x.u!==1 && x.t.includes("@"+me.n.split(" ")[0]));
const miParte = m => reparto(m).find(r=>r.id===1);
const misMisiones = () => missions.filter(m=>(m.resp===1||m.col.includes(1)) && m.est!=="completada");

/* Ritmo real: el Oro que ya tengo comprometido en misiones mías, por día */
function ritmoDiario(){
  const mias = misMisiones();
  const oro = mias.reduce((a,m)=>a + (miParte(m)?.oro||0), 0);
  const dias = Math.max(7, Math.round(Math.max(...mias.map(m=>m.due), 7*24*H)/(24*H)));
  return Math.max(8, Math.round(oro/dias));
}

let _oroVisto=null;
function contarHasta(el, fin){
  if(!el) return;
  const ini = _oroVisto===null ? fin : _oroVisto;
  _oroVisto = fin;
  if(ini===fin || matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=fmt(fin); return; }
  const t0=performance.now(), dur=620;
  (function paso(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=fmt(Math.round(ini+(fin-ini)*e));
    if(k<1) requestAnimationFrame(paso);
  })(t0);
}

/* =========================================================
   META DEL MES — se repite en Inicio, Ranking y Perfil
   ========================================================= */
function bloqueMeta(compacto){
  const m = state.metaMes;
  if(!m.puesta){
    return `<div class="card meta-card">
      <div class="row g10" style="margin-bottom:10px"><span class="wi">${IC.bandera}</span>
        <h3 style="flex:1">Tu meta del mes</h3></div>
      <p class="sub">Ponte tú mismo cuántas misiones quieres cerrar este mes. No la pone tu jefe y nadie más la ve.</p>
      <button class="btn sm primary" style="margin-top:11px" data-meta>Ponerme una meta</button>
    </div>`;
  }
  const pct = Math.min(100, Math.round(m.hecho/m.objetivo*100));
  const listo = m.hecho >= m.objetivo;
  return `<div class="card meta-card">
    <div class="row g10" style="margin-bottom:10px">
      <span class="wi">${IC.bandera}</span>
      <h3 style="flex:1">Tu meta del mes</h3>
      <button class="btn sm" data-meta>Cambiar</button>
    </div>
    <div class="row" style="justify-content:space-between; align-items:flex-end; margin-bottom:8px">
      <div class="score" style="font-size:34px; line-height:.95">${m.hecho} <span style="color:var(--ink-3)">de</span> ${m.objetivo}</div>
      <span class="chip ${listo?"ok":pct>=60?"gold":""}">${pct}%</span>
    </div>
    ${meter(m.hecho, m.objetivo, "gold")}
    ${!compacto?`<p class="sub" style="margin-top:10px">${listo
      ? "La cumpliste. La medalla «Determinación» es tuya."
      : `Te faltan <b>${m.objetivo-m.hecho}</b> misiones. Esta meta la pusiste tú: si no llegas, no pasa nada y nadie se entera.`}</p>`:""}
  </div>`;
}

      ${contador!==null?`<span class="c">${contador}</span>`:""}</div>

}
function proximoLogro(){
  const cands = trofeos.filter(t=>!t.got && t.prog && !t.oculto)
    .map(t=>({t, falta:t.prog[1]-t.prog[0], pct:t.prog[0]/t.prog[1]}))
    .sort((a,b)=>b.pct-a.pct);
  return cands[0];
}
function posicionDe(ambito){
  const base = ambito==="area" ? people.filter(p=>p.area===me.area) : people;
  const orden = [...base].sort((a,b)=>b.xp-a.xp);
  const i = orden.findIndex(p=>p.id===1);
  return {pos:i+1, total:orden.length, arriba:i>0?orden[i-1]:null, abajo:i<orden.length-1?orden[i+1]:null};
}
function vistaInicio(){
  const hh = PERIODOS[state.periodo].h;
  const hora = new Date().getHours();
  const saludo = hora<12 ? "Buenos días" : hora<19 ? "Buenas tardes" : "Buenas noches";
  const lvl = nivelDe(state.xp);

  const proximas = missions.filter(m=>m.est!=="completada" && m.due <= hh*H).sort((a,b)=>a.due-b.due);
  const wProximas = proximas.length ? proximas.slice(0,5).map(m=>{
    const r = restante(m.due);
    return `<button class="mini" data-mision="${m.id}">
      <div class="mini-b"><div class="mini-t">${esc(m.t)}</div>
        <div class="mini-m"><span class="chip ${r.tipo}">${r.txt}</span><span class="mini-x">${esc(m.area)}</span></div></div>
      ${state.optIn?`<span class="chip xp">${miParte(m)?miParte(m).xp:m.xp} XP</span>`:""}
    </button>`;
  }).join("") : `<div class="empty">Nada por entregar en este rango. Aprovecha.</div>`;

  const movidas = missions.filter(m=>m.msgs.length && ultimoMsg(m) <= hh).sort((a,b)=>ultimoMsg(a)-ultimoMsg(b));
  const wHilos = movidas.length ? movidas.slice(0,5).map(m=>{
    const u = m.msgs.reduce((a,b)=>a.h<=b.h?a:b);
    return `<button class="mini" data-mision="${m.id}">
      ${av(P(u.u),"sm")}
      <div class="mini-b"><div class="mini-t">${esc(m.t)}</div>
        <div class="mini-m"><span class="mini-x">${esc(nom(u.u).split(" ")[0])} · ${haceRato(u.h)}</span></div></div>
      <span class="chip">${m.msgs.length}</span>
    </button>`;
  }).join("") : `<div class="empty">Los hilos están tranquilos.</div>`;

  const menciones = [];
  missions.forEach(m => meNombran(m).filter(x=>x.h<=hh).forEach(x=>menciones.push({m,x})));
  menciones.sort((a,b)=>a.x.h-b.x.h);
  const wMenciones = menciones.length ? menciones.slice(0,4).map(({m,x})=>`
    <button class="mini" data-mision="${m.id}">
      ${av(P(x.u),"sm")}
      <div class="mini-b"><div class="mini-t">${esc(nom(x.u))} te nombró</div>

    </button>`).join("") : `<div class="empty">Nadie te ha nombrado en este rango.</div>`;

  /* --- PROYECTOS --- */
  const wProyectos = proyectos.map(pr=>{
    const ms = missions.filter(m=>m.proy===pr.id);
    const listas = ms.filter(m=>m.est==="completada").length;
    const riesgo = ms.filter(m=>m.est==="riesgo").length;
    return `<button class="mini" data-proyecto="${pr.id}">
      <span class="proy-dot" style="background:${pr.color}"></span>
      <div class="mini-b"><div class="mini-t">${esc(pr.n)}</div>
        <div class="mini-m"><span class="mini-x">${esc(pr.cliente)} · ${listas} de ${ms.length}</span>
        ${riesgo?`<span class="chip risk">${riesgo} en riesgo</span>`:""}</div>
        <div style="margin-top:7px">${meter(listas, ms.length||1)}</div></div>
    </button>`;
  }).join("");

  /* --- ESTADO DE TAREAS --- */
  const conteo = ["proxima","curso","revision","riesgo","completada"].map(k=>({
    k, n:ESTADOS[k].n, c:ESTADOS[k].c, v:missions.filter(m=>m.est===k).length
  }));
  const maxC = Math.max(...conteo.map(c=>c.v));
  const wEstado = `<div class="stack g8">${conteo.map(c=>`
    <button class="estado-row" data-filtro-ir="${c.k}">
      <span class="bl">${c.n}</span>
      <span class="bar-track"><span class="bar-fill c-${c.c||"n"}" style="width:${(c.v/maxC*100).toFixed(0)}%"></span></span>
      <span class="bv num">${c.v}</span>
    </button>`).join("")}</div>`;

  /* --- TU POSICIÓN --- */

  const wPos = `
    <div class="seg" style="margin-bottom:12px">

  const wLogro = pl ? `
    <div class="row g12" style="align-items:center">
      <span class="tico" style="width:52px;height:52px;flex:none">${IC[pl.t.ico]}</span>
      <div style="flex:1; min-width:0">
        <div class="mini-t" style="font-size:15px">${esc(pl.t.n)}</div>
        <div class="sub" style="margin-top:2px">${esc(pl.t.d)}</div>

    </div>

    <div class="row" style="justify-content:space-between; margin-top:8px">
      <span class="mini-x">${pl.t.prog[0]} de ${pl.t.prog[1]}</span>
      <span class="chip gold">Te faltan ${pl.falta}</span>
    </div>` : `<div class="empty">Ya los tienes todos.</div>`;

  /* --- BENEFICIOS --- */
  const activos = beneficios.filter(b=>b.estado!=="usado");
  const wActivos = activos.length ? activos.slice(0,4).map(b=>`
    <button class="mini" data-tab="perfil">
      <span class="item-ico" style="width:32px;height:32px">${IC[b.ico]}</span>
      <div class="mini-b"><div class="mini-t">${esc(b.n)}</div>
        <div class="mini-m"><span class="chip ${ESTADO_BEN[b.estado].chip}">${ESTADO_BEN[b.estado].txt}</span>
        ${b.regaloDe?`<span class="chip gold">Regalo de ${esc(nom(b.regaloDe).split(" ")[0])}</span>`:""}</div></div>
    </button>`).join("") : `<div class="empty">No tienes beneficios activos.</div>`;

  const porVencer = [...activos].sort((a,b)=>a.dias-b.dias);
  const wVencen = porVencer.length ? porVencer.slice(0,4).map(b=>`
    <button class="mini" data-tab="perfil">
      <div class="mini-b"><div class="mini-t">${esc(b.n)}</div>
        <div class="mini-m"><span class="mini-x">Vence ${b.vence}</span></div></div>
      <span class="chip ${b.dias<=3?"risk":b.dias<=10?"gold":""}">${b.dias===0?"hoy":b.dias+" d"}</span>
    </button>`).join("") : `<div class="empty">Nada por vencerse.</div>`;

  const nEmp = noticiasEmpresa.filter(n=>n.h<=hh*1.6);
  const wEmpresa = (nEmp.length?nEmp:noticiasEmpresa.slice(0,2)).map(n=>`
    <div class="news"><span class="news-i">${IC[n.ico]}</span>
      <div><div class="news-t">${esc(n.t)}</div><div class="news-d">${esc(n.d)}</div>
      <div class="mini-x" style="margin-top:4px">${haceRato(n.h)}</div></div></div>`).join("");

  const nLvl = noticiasLevelop.filter(zonaOk);

function planObjetivo(item){
  const falta = Math.max(0, item.p - state.oro);
  const ritmo = ritmoDiario();
  const dias = falta===0 ? 0 : Math.ceil(falta/ritmo);
  const mias = misMisiones()
    .map(m=>({m, parte:miParte(m)}))
    .filter(x=>x.parte)
    .sort((a,b)=>b.parte.oro-a.parte.oro)
    .slice(0,4);
  let acumulado = state.oro, pasos = [];
  for(const x of mias){
    acumulado += x.parte.oro;
    pasos.push({m:x.m, oro:x.parte.oro, acumulado});
    if(acumulado >= item.p) break;
  }
  const alcanzaConLoQueHay = acumulado >= item.p;
  const imposible = dias > DECAY_DIAS;
  /* Si no alcanza, ¿cuál es el mejor beneficio que SÍ alcanza? */
  const alternativa = shop.filter(zonaOk).filter(i=>gateAbierto(i.gate) && i.p<=state.oro+ritmo*30 && i.id!==item.id)
    .sort((a,b)=>b.p-a.p)[0];
  return {falta, ritmo, dias, pasos, alcanzaConLoQueHay, imposible, alternativa};
}

  const pl = planObjetivo(item);

/* =========================================================

const HITOS_RACHA = [
  {n:10,  t:"Constancia",     d:"Trofeo «Constancia» y un día de gracia extra al mes."},
  {n:20,  t:"Ritmo propio",   d:"Trofeo «Ritmo propio» y el escudo de foco sin gastar Oro, una vez."},

];
const proxHito = r => HITOS_RACHA.find(h=>h.n>r) || null;

    .sort((a,b)=>a.gate.v-b.gate.v).slice(0,5);
  return `<div class="veil" data-cerrar>

        </div>

        <div class="card" style="padding:4px 13px">
          <div class="kv"><span>Tu XP</span><span class="num">${fmt(state.xp)}</span></div>
          <div class="kv"><span>Rango actual</span><span>${rango.n}</span></div>

  const r = state.racha, h = proxHito(r);

  const felicitacion =
    r>=100 ? "Pasaste los cien. Esto ya no es una racha, es tu forma de trabajar." :

  return `<div class="veil" data-cerrar>

/* =========================================================
   VISTA · RANKING
   ========================================================= */
const METRICAS = {
  xp: {n:"Nivel", campo:"xp",  suf:" XP", sub:p=>`Nivel ${p.lvl} · ${p.area}`},
  oro:{n:"Oro",   campo:"oro", suf:"",    sub:p=>p.area},
  mis:{n:"Misiones", campo:"mis", suf:"", sub:p=>p.area}
};
function tablaOrdenada(){
  const base = state.rankAmbito==="area" ? people.filter(p=>p.area===me.area) : people;
  const c = METRICAS[state.rankMetrica].campo;
  return [...base].sort((a,b)=>b[c]-a[c]);
}
function filaRank(p,pos){
  const m=METRICAS[state.rankMetrica];
  return `<div class="rank-row ${p.id===1?"me":""}">
    <span class="rank-pos">${pos}</span>${av(p)}
    <div class="rank-b"><div class="rank-n">${esc(p.id===1?state.nombre+" (tú)":p.n)}</div>
      <div class="rank-s">${m.sub(p)}</div></div>
    <span class="rank-v">${fmt(p[m.campo])}${m.suf}</span></div>`;
}
function alt(ico,n,why,campo,unidad){
  const orden=[...people].sort((a,b)=>b[campo]-a[campo]);
  const top=orden.slice(0,3), miPos=orden.findIndex(p=>p.id===1)+1;
  return `<div class="altboard">
    <div class="row g8" style="margin-bottom:3px"><span style="width:18px;height:18px;color:var(--ink-3)">${IC[ico]}</span><h3>${n}</h3></div>
    <div class="why">${why}</div>
    <div class="stack g8">${top.map((p,i)=>`<div class="row g10">
      <span class="rank-pos" style="font-size:17px">${i+1}</span>${av(P(p.id),"sm")}
      <div class="rank-b"><div class="rank-n">${esc(p.id===1?state.nombre+" (tú)":p.n)}</div></div>
      <span class="rank-v">${p[campo]}</span></div>`).join("")}</div>
    <div class="note" style="margin-top:10px">Tú vas de <b class="num">#${miPos}</b> con <b class="num">${me[campo]}</b> ${unidad}.</div>
  </div>`;
}
function vistaRanking(){
  const tabla=tablaOrdenada(), iMe=tabla.findIndex(p=>p.id===1);
  const ini=Math.max(0,iMe-3), fin=Math.min(tabla.length,iMe+4), slice=tabla.slice(ini,fin);
  const m=METRICAS[state.rankMetrica];
  const arriba = iMe>0 ? tabla[iMe-1][m.campo]-me[m.campo] : 0;
  const meta={hecho:87,total:120};

  return `
  <div class="page-h"><div><span class="eyebrow">Entre todos</span><h1>Ranking</h1></div></div>

  ${bloqueMeta(false)}

  <div class="card" style="padding:15px; margin:14px 0">
    <div class="row" style="justify-content:space-between; margin-bottom:9px; gap:12px">
      <div><span class="eyebrow">Meta del equipo</span>
        <div class="score" style="font-size:30px; line-height:1; margin-top:5px; text-transform:uppercase">${meta.hecho} <span style="color:var(--ink-3)">de</span> ${meta.total} misiones</div></div>
      <span class="chip ok">${Math.round(meta.hecho/meta.total*100)}%</span>
    </div>
    ${meter(meta.hecho, meta.total, "gold")}
    <p class="sub" style="margin-top:9px">Si el equipo llega, todos suben un escalón. El denominador son <b>los que participan</b>, no la plantilla completa.</p>
  </div>

  <button class="btn wide primary" style="margin-bottom:14px" data-planpos>${IC.sube} Quiero subir de posición</button>

  <div class="row wrap g8" style="margin-bottom:12px">
    <div class="seg">${Object.entries(METRICAS).map(([k,v])=>`<button data-metrica="${k}" aria-pressed="${state.rankMetrica===k}">${v.n}</button>`).join("")}</div>
    <div class="seg">
      <button data-ambito="equipo" aria-pressed="${state.rankAmbito==="equipo"}">Toda la empresa</button>
      <button data-ambito="area" aria-pressed="${state.rankAmbito==="area"}">Mi área</button>
    </div>
  </div>
  <div class="seg" style="margin-bottom:12px">
    <button data-rmodo="cerca" aria-pressed="${state.rankModo==="cerca"}">Cerca de mí</button>
    <button data-rmodo="completa" aria-pressed="${state.rankModo==="completa"}">Tabla completa</button>
  </div>

  ${state.rankModo==="cerca"?`
    <div class="note" style="margin-bottom:10px">Ves tu puesto y los tres de arriba y los tres de abajo. La tabla completa existe, pero viene apagada: las tablas abiertas de arriba a abajo desinflan al que va de último.</div>
    ${ini>0?`<div class="gap-mark">${ini} por encima, sin mostrar</div>`:""}
    <div class="stack g8">${slice.map((p,i)=>filaRank(p,ini+i+1)).join("")}</div>
    ${fin<tabla.length?`<div class="gap-mark">${tabla.length-fin} por debajo, sin mostrar</div>`:""}
    ${arriba>0?`<div class="note gold" style="margin-top:10px">Te faltan <b class="num">${fmt(arriba)}</b> para alcanzar a ${esc(tabla[iMe-1].n)}.</div>`:""}
  `:`
    <div class="note risk" style="margin-bottom:10px">Estás viendo la tabla completa. La prendiste tú; vuelves a «Cerca de mí» cuando quieras.</div>
    <div class="stack g8">${tabla.map((p,i)=>filaRank(p,i+1)).join("")}</div>
  `}

  <div class="sec-h"><h2>Otras tablas</h2><span class="sub">No todo es cerrar misiones</span></div>
  <div class="stack g10">
    ${alt("panas","Más colaborador","Misiones donde te metiste a echarle una mano a otra persona.","colab","colaboraciones")}
    ${alt("sube","El que más mejoró","Cuánto creciste contra tu propia semana pasada, no contra los demás.","mejora","% de mejora")}
    ${alt("chat","Más presente en los hilos","Mensajes en hilos de misión que alguien respondió o marcó como útiles.","hilos","mensajes")}
  </div>`;
}

function modalPlanPosicion(){
  const amb = state.posAmbito;
  const pos = posicionDe(amb);
  if(!pos.arriba){
    return `<div class="veil" data-cerrar><div class="sheet" style="max-width:480px" data-stop role="dialog" aria-modal="true">
      <div class="sheet-h"><div style="flex:1"><span class="eyebrow">Tu posición</span><h2 style="margin-top:4px">Vas de primero</h2></div>
        <button class="closebtn" data-cerrar aria-label="Cerrar">${IC.x}</button></div>
      <div class="sheet-b"><div class="note ok">No hay a quién alcanzar en ${amb==="area"?esc(me.area):"la empresa"}. Y eso tampoco es la meta: es lo que pasó mientras trabajabas.</div></div>
      <div class="sheet-f"><button class="btn wide" data-cerrar>Cerrar</button></div></div></div>`;
  }
  const gap = pos.arriba.xp - me.xp;
  const mias = misMisiones().map(m=>({m, parte:miParte(m)})).filter(x=>x.parte);
  const xpDisponible = mias.reduce((a,x)=>a+x.parte.xp,0);
  const alcanza = xpDisponible >= gap;
  const enRiesgo = missions.filter(m=>m.est==="riesgo" && m.resp!==1 && !m.col.includes(1));
  const ordenadas = [...mias].sort((a,b)=>b.parte.xp-a.parte.xp).slice(0,4);
  let acc=0; const pasos = ordenadas.map(x=>{ acc+=x.parte.xp; return {...x, acc}; });

  return `<div class="veil" data-cerrar>
    <div class="sheet" style="max-width:560px" role="dialog" aria-modal="true" data-stop>
      <div class="sheet-h"><div style="flex:1"><span class="eyebrow">Subir de posición</span>
        <h2 style="margin-top:4px">Cómo alcanzar a ${esc(pos.arriba.n.split(" ")[0])}</h2></div>
        <button class="closebtn" data-cerrar aria-label="Cerrar">${IC.x}</button></div>
      <div class="sheet-b">
        <div class="seg" style="align-self:flex-start">
          <button data-posambito="area" aria-pressed="${amb==="area"}">Mi área</button>
          <button data-posambito="equipo" aria-pressed="${amb==="equipo"}">Toda la empresa</button>
        </div>

        <div class="card" style="padding:13px">
          <div class="kv"><span>Vas de</span><span class="num">#${pos.pos} de ${pos.total}</span></div>
          <div class="kv"><span>Quien va arriba</span><span>${esc(pos.arriba.n)}</span></div>
          <div class="kv"><span>Te faltan</span><span class="num" style="color:var(--xp)">${fmt(gap)} XP</span></div>
          <div class="kv"><span>Ya tienes comprometidos</span><span class="num">${fmt(xpDisponible)} XP</span></div>
        </div>

        ${alcanza
          ? `<div class="note ok"><b>Con lo que ya tienes asignado te alcanza.</b> No hace falta que agarres nada nuevo — solo cerrar lo tuyo.</div>`
          : `<div class="note gold">Con lo tuyo llegas a <b class="num">${fmt(xpDisponible)}</b> de los ${fmt(gap)} que faltan. El resto no te lo voy a inventar: sale del trabajo que venga, o de sumarte donde de verdad hagas falta.</div>`}

        <div>
          <span class="eyebrow">Lo que ya es tuyo</span>
          <div class="stack g8" style="margin-top:11px">
            ${pasos.length?pasos.map((p,i)=>`<div class="paso">
              <span class="paso-n num">${i+1}</span>
              <div style="flex:1; min-width:0"><div class="mini-t">${esc(p.m.t)}</div>
                <div class="mini-x">${restante(p.m.due).txt}</div></div>
              <span class="chip xp">+${p.parte.xp}</span>
              <span class="mini-x num">${fmt(p.acc)}</span>
            </div>`).join(""):`<div class="empty">No tienes misiones asignadas.</div>`}
          </div>
        </div>

        ${!alcanza && enRiesgo.length ? `
        <div>
          <span class="eyebrow">Donde harías falta de verdad</span>
          <div class="stack g8" style="margin-top:11px">
            ${enRiesgo.slice(0,3).map(m=>`<button class="mini" data-mision="${m.id}">
              <div class="mini-b"><div class="mini-t">${esc(m.t)}</div>
              <div class="mini-m"><span class="chip risk">${restante(m.due).txt}</span>
              <span class="mini-x">${esc(nom(m.resp).split(" ")[0])} la lleva</span></div></div>
              <span class="chip xp">+${Math.round(m.xp*0.4/Math.max(1,m.col.length+1))}</span>
            </button>`).join("")}
          </div>
          <div class="note" style="margin-top:10px">Estas están en riesgo y las lleva otra persona. Sumarte da XP <b>y</b> le quita un peso de encima a alguien. Es la única forma de subir que también le sirve a otro.</div>

/* =========================================================
   ACCIONES
   ========================================================= */
function gastar(n){
  let falta = n;
  lotesOro.sort((a,b)=>a.dias-b.dias);
  for(const l of lotesOro){
    const usa = Math.min(l.oro, falta);
    l.oro -= usa; falta -= usa;
    if(falta<=0) break;
  }
  lotesOro = lotesOro.filter(l=>l.oro>0);
  state.oro = oroTotal();
}
function ganar(n, dias=DECAY_DIAS){ lotesOro.push({oro:n, dias}); state.oro = oroTotal(); }

function enviarARevision(id){
  const m=missions.find(x=>x.id===id);
  if(!m || m.est==="revision" || m.est==="completada") return;
  m.est="revision"; m.sync="pendiente"; m.revBy=1; m.revH=0;
  cerrarModal();
  toast("sync","sync","Enviada a revisión","Le llegó al líder de área. Cuando la valide se acredita el reparto.",4200);
  setTimeout(()=>{
    m.sync="confirmada";
    toast("ok","check","El líder la validó", `Se acreditó lo que te toca del reparto.`);
    const parte = reparto(m).find(r=>r.id===1);
    if(state.optIn && parte){
      state.xp += parte.xp; ganar(parte.oro);
      state.metaMes.hecho += 1;
      m.est="completada";
      const l1=nivelDe(state.xp-parte.xp), l2=nivelDe(state.xp);
      if(l2>l1) setTimeout(()=>toast("ok","corona",`Subiste al nivel ${l2}`,`Rango ${rangoDe(l2).n}. Se te abrieron cosas nuevas en la Tienda.`,5400),700);
      if(state.metaMes.puesta && state.metaMes.hecho===state.metaMes.objetivo){
        const tr = trofeos.find(t=>t.n==="Determinación");
        if(tr && !tr.got){ tr.got = fecha(new Date()); tr.oculto=false;
          setTimeout(()=>toast("ok","bandera","Trofeo oculto: Determinación","Te pusiste tu propia meta del mes y la cumpliste.",6000),1400); }
      }
    } else { m.est="completada"; }
    render();
  },2800);
  render();
}

function pedir(item){
  if(state.oro<item.p || item.cupo[0]<=0) return;
  gastar(item.p); item.cupo[0] -= 1;
  cerrarModal();
  const hoy=new Date(), fin=new Date(Date.now()+30*24*H);
  const nuevo={id:"b"+Date.now(), ico:item.ico, n:item.n, pedido:fecha(hoy), vence:fecha(fin), estado:"proceso", cod:"—", dias:30};
  beneficios.unshift(nuevo);
  if(state.objetivo===item.id) state.objetivo=null;
  toast("sync","sync","Pedido en proceso", `Te descontamos ${fmt(item.p)} de Oro, empezando por el lote más viejo.`, 3200);
  setTimeout(()=>{
    nuevo.estado="activo"; nuevo.cod="LVL-"+Math.floor(1000+Math.random()*8999);
    toast("ok","ticket","Confirmado", `${item.n} · código ${nuevo.cod}. Lo ves en tu Perfil.`, 5400);
    render();
  },3000);
  render();
}

function regalar(item, paraId){
  if(state.oro<item.p) return;
  gastar(item.p); item.cupo[0] = Math.max(0, item.cupo[0]-1);
  cerrarModal();
  toast("ok","regalo","Regalo enviado", `${nom(paraId)} ya tiene «${item.n}», con tu nombre.`, 5400);
  render();
}

  const dentroAvisos = e.target.closest("#avisosdrop, #bell");
  if(!dentroAvisos) toggleAvisos(false);

  const t=e.target.closest("[data-tab],[data-periodo],[data-filtro],[data-filtro-ir],[data-mision],[data-proyecto],[data-cerrar],[data-revisar],[data-formula],[data-enviar],[data-sumarme],[data-shopcat],[data-shoptab],[data-pedidos],[data-pedir],[data-confirmar],[data-reglas],[data-objetivo],[data-fijarobjetivo],[data-quitarobjetivo],[data-regalar],[data-confirmarregalo],[data-sugerir],[data-mandarsug],[data-pedirayuda],[data-confirmarayuda],[data-ayudar],[data-metrica],[data-ambito],[data-rmodo],[data-posambito],[data-planpos],[data-meta],[data-guardarmeta],[data-quitarmeta],[data-trofeo],[data-medalla],[data-color],[data-guardar],[data-ajustes],[data-plegar],[data-reintentar],[data-limpiar],[data-nueva],[data-crear],[data-info],[data-irtienda],[data-duelo],[data-salirduelo],[data-usartop],[data-aviso],#optin,#bell,#themebtn,[data-stop]");
  if(!t) return;

  if(t.id==="themebtn"){
    const cur=document.documentElement.getAttribute("data-theme")||"dark";
    const nuevo = cur==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nuevo);
    try{ localStorage.setItem("lvl-tema", nuevo); }catch(err){}
    return;
  }
  if(t.id==="bell"){ toggleAvisos(); return; }
  if(t.dataset.info){
    const q = t.dataset.info;
    abrirModal(q==="oro" ? modalReglas() : q==="nivel" ? modalNivel() : q==="racha" ? modalRacha() : modalZona());
    return;
  }
  if(t.hasAttribute("data-irtienda")){ cerrarModal(); state.tab="tienda"; render(); return; }
  if(t.hasAttribute("data-duelo")){ abrirModal(modalDuelo()); return; }
  if(t.hasAttribute("data-usartop")){ abrirModal(modalTop()); return; }
  if(t.hasAttribute("data-salirduelo")){
    duelo.dentro = !duelo.dentro;
    toast(duelo.dentro?"ok":"", duelo.dentro?"check":"bandera",
      duelo.dentro?"Volviste al desafío":"Te saliste del desafío",
      duelo.dentro?"Vuelves a sumar al marcador de tu área."
                  :"Nadie recibe un aviso de esto, ni tu líder ni tu equipo.");
    render(); return;
  }
  if(t.dataset.aviso){
    const a = t.dataset.aviso;
    abrirModal(a==="duelo"?modalDuelo():a==="apoyo"?modalApoyo():modalTop());
    return;
  }
  if(t.hasAttribute("data-limpiar")){ avisos=[]; pintarAvisos(); pintarHud(); return; }

  if(t.hasAttribute("data-tab")){ cerrarModal(); state.tab=t.dataset.tab; render(); return; }
  if(t.hasAttribute("data-periodo")){ state.periodo=t.dataset.periodo; render(); return; }
  if(t.hasAttribute("data-filtro")){ state.filtro=t.dataset.filtro; render(); return; }
  if(t.hasAttribute("data-filtro-ir")){ state.tab="misiones"; state.filtro=t.dataset.filtroIr; render(); return; }
  if(t.hasAttribute("data-shopcat")){ state.shopCat=t.dataset.shopcat; render(); return; }
  if(t.hasAttribute("data-shoptab")){ state.shopTab=t.dataset.shoptab; render(); return; }
  if(t.hasAttribute("data-pedidos")){ state.pedidosRango=t.dataset.pedidos; render(); return; }
  if(t.hasAttribute("data-metrica")){ state.rankMetrica=t.dataset.metrica; render(); return; }
  if(t.hasAttribute("data-ambito")){ state.rankAmbito=t.dataset.ambito; render(); return; }
  if(t.hasAttribute("data-rmodo")){ state.rankModo=t.dataset.rmodo; render(); return; }
  if(t.hasAttribute("data-posambito")){
    state.posAmbito=t.dataset.posambito;
    if(document.querySelector(".veil")) abrirModal(modalPlanPosicion()); else render();
    return;
  }
  if(t.hasAttribute("data-plegar")){ const k=t.dataset.plegar; state.plegado[k]=!state.plegado[k]; render(); return; }

  if(t.hasAttribute("data-mision")){
    const m=missions.find(x=>x.id===+t.dataset.mision);
    state.abierta=m.id; abrirModal(detalleMision(m)); return;
  }
  if(t.hasAttribute("data-proyecto")){ abrirModal(modalProyecto(PR(t.dataset.proyecto))); return; }
  if(t.hasAttribute("data-cerrar")){ cerrarModal(); state.abierta=null; return; }
  if(t.hasAttribute("data-revisar")){ enviarARevision(+t.dataset.revisar); return; }
  if(t.hasAttribute("data-formula")){ document.getElementById("formula").classList.toggle("hide"); return; }

  if(t.hasAttribute("data-sumarme")){
    const m=missions.find(x=>x.id===state.abierta);
    if(m && !m.col.includes(1) && m.resp!==1){
      m.col.push(1); abrirModal(detalleMision(m));
      toast("ok","panas","Te metiste en la misión","Tu equipo ya se enteró por el hilo. El reparto se recalculó solo.");
      render();
    }
    return;
  }
  if(t.hasAttribute("data-enviar")){
    const ta=document.getElementById("msgin"), v=ta.value.trim();
    if(!v) return;
    const m=missions.find(x=>x.id===state.abierta);
    m.msgs.push({u:1,t:v,h:0});
    abrirModal(detalleMision(m));
    const b=document.querySelector(".sheet-b"); if(b) b.scrollTop=b.scrollHeight;
    return;
  }

  if(t.hasAttribute("data-pedirayuda")){ abrirModal(modalPedirAyuda(missions.find(x=>x.id===+t.dataset.pedirayuda))); return; }
  if(t.hasAttribute("data-confirmarayuda")){
    const m=missions.find(x=>x.id===+t.dataset.confirmarayuda);
    const alcance=document.querySelector('#alcance [aria-pressed="true"]').dataset.v;
    const oro=Math.max(10,Math.min(80,+document.getElementById("oroayuda").value||oroSugerido(m)));
    const para=alcance==="uno" ? +document.getElementById("quien").value : null;
    m.ayuda={abierta:true, alcance, para, oro, respuestas:[]};
    cerrarModal(); render();
    toast("ok","mano","Pedido publicado", alcance==="equipo"
      ? `Le llegó a todo el equipo. Ofreces ${oro} de Oro del pozo.`
      : `Le llegó a ${nom(para)}. Ofreces ${oro} de Oro del pozo.`, 5200);
    return;
  }
  if(t.hasAttribute("data-ayudar")){
    const [id,resp]=t.dataset.ayudar.split("|");
    const m=missions.find(x=>x.id===+id);
    if(!m.col.includes(1)) m.col.push(1);
    m.ayuda.abierta=false;
    if(resp==="si"){
      ganar(m.ayuda.oro);
      toast("ok","mano","Te sumaste y tomaste el Oro", `+${m.ayuda.oro} de Oro del pozo. Ya apareces en el reparto.`, 5200);
    } else {
      const tr=trofeos.find(x=>x.n==="Porque soy pana");
      if(tr && tr.prog){ tr.prog[0]=Math.min(tr.prog[1], tr.prog[0]+1);
        if(tr.prog[0]>=tr.prog[1] && !tr.got){ tr.got=fecha(new Date()); tr.oculto=false; } }
      toast("ok","panas","Ayudaste porque eres pana", `Los ${m.ayuda.oro} de Oro volvieron al pozo. Suma para un trofeo que no está en la lista.`, 5600);
    }
    abrirModal(detalleMision(m)); render();
    return;
  }

  if(t.hasAttribute("data-pedir")){ abrirModal(modalPedir(shop.find(i=>i.id===t.dataset.pedir))); return; }
  if(t.hasAttribute("data-confirmar")){ pedir(shop.find(i=>i.id===t.dataset.confirmar)); return; }
  if(t.hasAttribute("data-reglas")){ abrirModal(modalReglas()); return; }
  if(t.hasAttribute("data-objetivo")){ abrirModal(modalObjetivo(shop.find(i=>i.id===t.dataset.objetivo))); return; }
  if(t.hasAttribute("data-fijarobjetivo")){
    state.objetivo=t.dataset.fijarobjetivo; cerrarModal(); state.tab="tienda"; render();
    toast("ok","bandera","Objetivo puesto","Lo ves arriba en la Tienda. Lo quitas cuando quieras y nadie se entera.",5000);
    return;
  }
  if(t.hasAttribute("data-quitarobjetivo")){ state.objetivo=null; cerrarModal(); render(); return; }
  if(t.hasAttribute("data-regalar")){ abrirModal(modalRegalar(shop.find(i=>i.id===t.dataset.regalar))); return; }
  if(t.hasAttribute("data-confirmarregalo")){
    const item=shop.find(i=>i.id===t.dataset.confirmarregalo);
    regalar(item, +document.getElementById("paraquien").value);
    return;
  }
  if(t.hasAttribute("data-sugerir")){ abrirModal(modalSugerencia(t.dataset.sugerir)); return; }
  if(t.hasAttribute("data-mandarsug")){
    const txt=document.getElementById("sugtxt").value.trim();
    if(!txt){ toast("risk","alerta","Escribe algo primero","Sin la idea no hay nada que mandar."); return; }
    const conNombre=document.getElementById("sugnombre").checked;
    sugerencias.push({cat:t.dataset.mandarsug, txt, nombre:conNombre?state.nombre:null});
    cerrarModal();
    toast("ok","check","Mandada", conNombre
      ? "Va con tu nombre a los líderes de tu empresa y al equipo de Levelop."
      : "Va sin tu nombre a los líderes de tu empresa y al equipo de Levelop.", 5200);
    return;
  }

  if(t.hasAttribute("data-planpos")){ abrirModal(modalPlanPosicion()); return; }
  if(t.hasAttribute("data-meta")){ abrirModal(modalMeta()); return; }
  if(t.hasAttribute("data-guardarmeta")){
    const v=Math.max(1,Math.min(60,+document.getElementById("metain").value||12));
    state.metaMes.objetivo=v; state.metaMes.puesta=true;
    cerrarModal(); render();
    toast("ok","bandera","Meta puesta", `${v} misiones este mes. Solo tú la ves.`, 4600);
    return;
  }
  if(t.hasAttribute("data-quitarmeta")){ state.metaMes.puesta=false; cerrarModal(); render(); return; }

  if(t.hasAttribute("data-trofeo")){ abrirModal(modalTrofeo(trofeos.find(x=>x.id===+t.dataset.trofeo), false)); return; }
  if(t.hasAttribute("data-medalla")){ abrirModal(modalTrofeo(medallasEquipo.find(x=>x.id===t.dataset.medalla), true)); return; }

  if(t.hasAttribute("data-ajustes")){ abrirModal(modalAjustes()); return; }
  if(t.hasAttribute("data-color")){
    state.color=t.dataset.color;
    document.querySelectorAll("[data-color]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.color===state.color));
    return;
  }
  if(t.hasAttribute("data-guardar")){
    const v=document.getElementById("nombrein").value.trim();
    if(v) state.nombre=v;
    cerrarModal(); render();
    toast("ok","check","Listo","Así te ven en misiones, hilos y tablas.");
    return;
  }
  if(t.hasAttribute("data-reintentar")){
    const b=beneficios.find(x=>x.id===t.dataset.reintentar);
    b.estado="proceso";
    toast("sync","sync","Averiguando con el aliado","Te avisamos apenas tengamos una respuesta de verdad.");
    setTimeout(()=>{
      b.estado="activo"; b.cod="LVL-"+Math.floor(1000+Math.random()*8999);
      toast("ok","check","Sí quedó registrado","Código "+b.cod+". Ya lo puedes usar.",5200);
      render();
    },2800);
    render(); return;
  }

  if(t.id==="optin"){
    state.optIn=!state.optIn;
    cerrarModal(); render();
    toast(state.optIn?"ok":"", state.optIn?"check":"tema",
      state.optIn?"Juego prendido":"Juego apagado",
      state.optIn?"Vuelves a ganar Oro y a aparecer en las tablas."
                 :"Dejas de ganar Oro nuevo. El que tienes sigue caducando a los 90 días, como el de todos.",5600);
    return;
  }

  if(t.hasAttribute("data-nueva")){ abrirModal(modalNueva()); previewNueva(); return; }
  if(t.hasAttribute("data-crear")){
    const titulo=document.getElementById("nt").value.trim();
    if(!titulo){ toast("risk","alerta","Falta el título","Escribe qué hay que hacer para poder montarla."); return; }
    const g=id=>document.querySelector(`#${id} [aria-pressed="true"]`).dataset.v;
    const dias=Math.max(1,+document.getElementById("nd").value||5);
    const m={id:120+missions.length, t:titulo, area:me.area, proy:document.getElementById("nproy").value,
      est:"proxima", urg:g("nurg"), imp:g("nimp"), esf:g("nesf"),
      due:dias*24*H, resp:1, col:[], sync:"confirmada", d:"Todavía sin descripción.", msgs:[]};
    m.xp=calcXP(m); m.oro=0;
    missions.push(m); cerrarModal(); state.tab="misiones"; state.filtro="mias"; render();
    toast("ok","check","Misión montada", `${m.xp} XP cuando la validen. El Oro se activa cuando alguien más la acepte.`, 5400);
    return;
  }
});

/* Segmentos internos de los modales */
document.addEventListener("click", e=>{
  const b=e.target.closest("#nurg button, #nimp button, #nesf button, #alcance button");
  if(!b) return;
  b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  if(b.closest("#alcance")){
    document.getElementById("quienwrap").classList.toggle("hide", b.dataset.v!=="uno");
  } else previewNueva();
});
function previewNueva(){
  const p=document.getElementById("preview"); if(!p) return;
  const g=id=>document.querySelector(`#${id} [aria-pressed="true"]`).dataset.v;
  const fake={urg:g("nurg"), imp:g("nimp"), esf:g("nesf")};
  p.innerHTML=`Te va a dejar <b class="num">${calcXP(fake)} XP</b> y <b class="num">${calcOro(fake)} de Oro</b> cuando otra persona la acepte.`;
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ cerrarModal(); toggleAvisos(false); state.abierta=null; }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ const s=document.querySelector("[data-enviar]"); if(s) s.click(); }
});

render();
})();
</script>
